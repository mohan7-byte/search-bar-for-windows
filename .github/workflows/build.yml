                  private void RenderFavoritesBoard(string filterText)
                  {
                      if (_favoritesContainer == null) return;
                      _favoritesContainer.Children.Clear();
                      string query = (filterText ?? "").Trim();
                      var matches = _favorites.Where(f =>
                          string.IsNullOrEmpty(query) ||
                          (f.Title ?? "").IndexOf(query, StringComparison.OrdinalIgnoreCase) >= 0 ||
                          (f.TargetPath ?? "").IndexOf(query, StringComparison.OrdinalIgnoreCase) >= 0).Take(40).ToList();

                      if (matches.Count == 0)
                      {
                          _favoritesContainer.Children.Add(new Border
                          {
                              CornerRadius = new CornerRadius(10), Padding = new Thickness(15),
                              Background = new SolidColorBrush(Color.FromArgb(22, 130, 140, 160)),
                              Child = new TextBlock
                              {
                                  Text = string.IsNullOrWhiteSpace(query)
                                      ? "No favorites yet. Star a website, app, file or folder result to pin it here."
                                      : "No favorites match '" + query + "'.",
                                  Foreground = _secondaryTextBrush, TextWrapping = TextWrapping.Wrap, FontSize = 12
                              }
                          });
                          return;
                      }

                      foreach (var favorite in matches)
                      {
                          var card = new Border
                          {
                              CornerRadius = new CornerRadius(10), BorderThickness = new Thickness(1),
                              BorderBrush = new SolidColorBrush(Color.FromArgb(45, 140, 150, 170)),
                              Background = new SolidColorBrush(Color.FromArgb(18, 120, 130, 150)),
                              Padding = new Thickness(11, 9, 11, 9), Margin = new Thickness(0, 0, 0, 7)
                          };
                          var grid = new Grid();
                          grid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                          grid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                          grid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                          var textStack = new StackPanel { VerticalAlignment = VerticalAlignment.Center };
                          textStack.Children.Add(new TextBlock
                          {
                              Text = (string.IsNullOrWhiteSpace(favorite.Emoji) ? "★" : favorite.Emoji) + "  " + favorite.Title,
                              FontSize = 12.5, FontWeight = FontWeights.SemiBold, Foreground = _primaryTextBrush,
                              TextTrimming = TextTrimming.CharacterEllipsis
                          });
                          textStack.Children.Add(new TextBlock
                          {
                              Text = favorite.TargetPath, FontSize = 10.5, Foreground = _secondaryTextBrush,
                              TextTrimming = TextTrimming.CharacterEllipsis, Margin = new Thickness(0, 2, 0, 0)
                          });
                          Grid.SetColumn(textStack, 0);
                          grid.Children.Add(textStack);
                          var openButton = CreateActionButton("Open", true);
                          openButton.Margin = new Thickness(8, 0, 0, 0);
                          openButton.VerticalAlignment = VerticalAlignment.Center;
                          openButton.Click += (s, e) => LaunchTarget(favorite.TargetPath, false, false, true);
                          Grid.SetColumn(openButton, 1);
                          grid.Children.Add(openButton);
                          var removeButton = new Button
                          {
                              Content = "★", FontSize = 16,
                              Foreground = new SolidColorBrush(Color.FromRgb(240, 180, 65)),
                              Background = Brushes.Transparent, BorderThickness = new Thickness(0),
                              Padding = new Thickness(8, 0, 4, 0), ToolTip = "Unpin favorite",
                              Cursor = Cursors.Hand, VerticalAlignment = VerticalAlignment.Center
                          };
                          string favoriteTarget = favorite.TargetPath;
                          removeButton.Click += (s, e) =>
                          {
                              _favorites.RemoveAll(x => string.Equals(x.TargetPath, favoriteTarget, StringComparison.OrdinalIgnoreCase));
                              SaveFavorites();
                              RenderFavoritesBoard(filterText);
                              UpdateShortcutList();
                          };
                          Grid.SetColumn(removeButton, 2);
                          grid.Children.Add(removeButton);
                          card.Child = grid;
                          _favoritesContainer.Children.Add(card);
                      }
                  }

                  private void StartAiQuery(string prompt)
                  {
                      if (_aiBoard == null) return;
                      _settingsPanel.Visibility = Visibility.Collapsed;
                      _notesBoard.Visibility = Visibility.Collapsed;
                      _favoritesBoard.Visibility = Visibility.Collapsed;
                      _resultsList.Visibility = Visibility.Collapsed;
                      _aiBoard.Visibility = Visibility.Visible;
                      if (string.IsNullOrWhiteSpace(prompt))
                      {
                          _aiStatusText.Text = "SESSION ONLY  •  Chat and images are not saved";
                          if (_aiConversation.Count == 0 && _aiContent.Children.Count == 0)
                          {
                              var welcome = CreateAiBubble(true, "READY WHEN YOU ARE");
                              RenderAiMarkdownInto(welcome.Child as StackPanel, "Ask a question, continue a conversation, or press **Ctrl+V** to attach a screenshot. Your chat exists only in this running session.", false);
                              _aiContent.Children.Add(welcome);
                          }
                          return;
                      }
                      SendAiMessage(prompt, null, null);
                  }

                  private void SendAiComposerMessage()
                  {
                      if (_aiRequestRunning) { _aiStatusText.Text = "Please wait for the current response or press Stop."; return; }
                      string prompt = _aiComposer == null ? "" : _aiComposer.Text.Trim();
                      if (string.IsNullOrWhiteSpace(prompt) && _pendingAiImageBytes == null) return;
                      if (_aiComposer != null) _aiComposer.Clear();
                      SendAiMessage(prompt, _pendingAiImageBytes, _pendingAiImageMimeType);
                  }

                  private void SendAiMessage(string prompt, byte[] imageBytes, string mimeType)
                  {
                      if (_aiBoard == null || _aiRequestRunning) return;
                      _settingsPanel.Visibility = Visibility.Collapsed;
                      _notesBoard.Visibility = Visibility.Collapsed;
                      _favoritesBoard.Visibility = Visibility.Collapsed;
                      _resultsList.Visibility = Visibility.Collapsed;
                      _aiBoard.Visibility = Visibility.Visible;

                      var user = new AiChatMessage
                      {
                          Role = "user", Text = prompt ?? "",
                          ImageData = imageBytes == null ? null : (byte[])imageBytes.Clone(),
                          MimeType = string.IsNullOrWhiteSpace(mimeType) ? "image/png" : mimeType
                      };
                      if (string.IsNullOrWhiteSpace(user.Text) && user.ImageData != null) user.Text = "Please analyze this image.";
                      _aiConversation.Add(user);
                      var userBubble = CreateAiBubble(false, "YOU");
                      var userBody = userBubble.Child as StackPanel;
                      if (user.ImageData != null)
                      {
                          var image = new Image { Source = CreateImageFromBytes(user.ImageData), Stretch = Stretch.Uniform };
                          image.MaxWidth = 340; image.MaxHeight = 190;
                          image.HorizontalAlignment = HorizontalAlignment.Left; image.Margin = new Thickness(0, 0, 0, 7);
                          userBody.Children.Add(image);
                      }
                      if (!string.IsNullOrWhiteSpace(user.Text))
                          userBody.Children.Add(new TextBlock { Text = user.Text, FontSize = 12.5, Foreground = _primaryTextBrush, TextWrapping = TextWrapping.Wrap, LineHeight = 20 });
                      _aiContent.Children.Add(userBubble);
                      ClearPendingAiImage();

                      var assistantBubble = CreateAiBubble(true, "✦  GEMINI");
                      var assistantBody = assistantBubble.Child as StackPanel;
                      var liveText = new TextBlock { Text = "", FontSize = 12.5, Foreground = _primaryTextBrush, TextWrapping = TextWrapping.Wrap, LineHeight = 20 };
                      assistantBody.Children.Add(liveText); _aiContent.Children.Add(assistantBubble);
                      _aiScrollViewer.ScrollToEnd();

                      int generation = ++_aiGeneration;
                      List<AiChatMessage> snapshot = CloneAiMessages(_aiConversation);
                      var cancellation = new CancellationTokenSource();
                      _aiCancellation = cancellation; _aiRequestRunning = true;
                      _aiSendButton.IsEnabled = false; _aiStopButton.Visibility = Visibility.Visible;
                      string modelName = string.IsNullOrWhiteSpace(_config.AiModel) ? "Gemini" : _config.AiModel;
                      _aiStatusText.Text = "CONNECTING  •  " + modelName;
                      var streamed = new StringBuilder();

                      Task.Run(async () =>
                      {
                          string answer = ""; bool completed = false; bool canceled = false;
                          try
                          {
                              await AskGeminiStreamingAsync(snapshot, cancellation.Token, chunk =>
                              {
                                  string current;
                                  lock (streamed) { streamed.Append(chunk); current = streamed.ToString(); }
                                  Dispatcher.BeginInvoke(DispatcherPriority.Background, new Action(() =>
                                  {
                                      if (generation != _aiGeneration) return;
                                      liveText.Text = current;
                                      if (_aiScrollViewer != null) _aiScrollViewer.ScrollToEnd();
                                  }));
                              }).ConfigureAwait(false);
                              lock (streamed) answer = streamed.ToString();
                              if (string.IsNullOrWhiteSpace(answer)) throw new InvalidOperationException("Gemini returned no text answer. Please try again.");
                              completed = true;
                          }
                          catch (OperationCanceledException) { canceled = true; lock (streamed) answer = streamed.ToString(); }
                          catch (Exception ex)
                          {
                              if (cancellation.IsCancellationRequested)
                              {
                                  canceled = true;
                                  lock (streamed) answer = streamed.ToString();
                              }
                              else answer = "AI request failed: " + ex.Message;
                          }
                          finally
                          {
                              ClearAiMessages(snapshot);
                              cancellation.Dispose();
                              Dispatcher.BeginInvoke(new Action(() =>
                              {
                                  if (generation != _aiGeneration) return;
                                  if (assistantBody.Children.Contains(liveText)) assistantBody.Children.Remove(liveText);
                                  if (string.IsNullOrWhiteSpace(answer)) answer = canceled ? "Generation stopped." : "Gemini returned no text answer. Please try again.";
                                  RenderAiMarkdownInto(assistantBody, answer, false);
                                  if (completed)
                                  {
                                      _lastAiResponse = answer;
                                      _aiConversation.Add(new AiChatMessage { Role = "model", Text = answer });
                                      _aiStatusText.Text = "ANSWER READY  •  " + modelName + "  •  SESSION ONLY";
                                  }
                                  else if (canceled) _aiStatusText.Text = "STOPPED  •  Partial output is visible but not in chat context";
                                  else { _lastAiResponse = ""; _aiStatusText.Text = "REQUEST FAILED  •  Check the message above"; }
                                  _aiRequestRunning = false;
                                  if (ReferenceEquals(_aiCancellation, cancellation)) _aiCancellation = null;
                                  _aiStopButton.Visibility = Visibility.Collapsed; _aiSendButton.IsEnabled = true;
                                  _aiScrollViewer.ScrollToEnd(); _aiComposer.Focus();
                              }));
                          }
                      });
                  }

                  private Border CreateAiBubble(bool assistant, string heading)
                  {
                      byte[] p = GetActiveThemePalette();
                      var b = new Border
                      {
                          CornerRadius = new CornerRadius(12), BorderThickness = new Thickness(1),
                          BorderBrush = new SolidColorBrush(Color.FromArgb(assistant ? (byte)36 : (byte)52, p[3], p[4], p[5])),
                          Background = new SolidColorBrush(Color.FromArgb(assistant ? (byte)14 : (byte)22, p[3], p[4], p[5])),
                          Padding = new Thickness(12, 10, 12, 10), Margin = new Thickness(0, 0, 0, 8)
                      };
                      var body = new StackPanel();
                      body.Children.Add(new TextBlock
                      {
                          Text = heading, FontSize = 10, FontWeight = FontWeights.Bold,
                          Foreground = assistant ? new SolidColorBrush(Color.FromRgb(p[3], p[4], p[5])) : _secondaryTextBrush,
                          Margin = new Thickness(0, 0, 0, 6)
                      });
                      b.Child = body; return b;
                  }

                  private static List<AiChatMessage> CloneAiMessages(IEnumerable<AiChatMessage> messages)
                  {
                      var clone = new List<AiChatMessage>();
                      foreach (var m in messages)
                          clone.Add(new AiChatMessage { Role = m.Role, Text = m.Text, MimeType = m.MimeType, ImageData = m.ImageData == null ? null : (byte[])m.ImageData.Clone() });
                      return clone;
                  }

                  private static void ClearAiMessages(List<AiChatMessage> messages)
                  {
                      if (messages == null) return;
                      foreach (var m in messages)
                      {
                          if (m.ImageData != null) { Array.Clear(m.ImageData, 0, m.ImageData.Length); m.ImageData = null; }
                          m.Text = null; m.MimeType = null; m.Role = null;
                      }
                      messages.Clear();
                  }

                  private void ClearPendingAiImage()
                  {
                      if (_pendingAiImageBytes != null) { Array.Clear(_pendingAiImageBytes, 0, _pendingAiImageBytes.Length); _pendingAiImageBytes = null; }
                      _pendingAiImageMimeType = "image/png";
                      if (_aiPreviewImage != null) _aiPreviewImage.Source = null;
                      if (_aiImagePreviewPanel != null) _aiImagePreviewPanel.Visibility = Visibility.Collapsed;
                  }

                  private void ClearAiSession()
                  {
                      ++_aiGeneration;
                      try { if (_aiCancellation != null) _aiCancellation.Cancel(); _httpClient.CancelPendingRequests(); } catch { }
                      _aiCancellation = null; _aiRequestRunning = false;
                      ClearAiMessages(_aiConversation); ClearPendingAiImage(); _lastAiResponse = "";
                      if (_aiContent != null) _aiContent.Children.Clear();
                      if (_aiComposer != null) _aiComposer.Clear();
                      if (_aiSendButton != null) _aiSendButton.IsEnabled = true;
                      if (_aiStopButton != null) _aiStopButton.Visibility = Visibility.Collapsed;
                      if (_aiStatusText != null) _aiStatusText.Text = "SESSION CLEARED  •  Nothing is saved to disk";
                  }

                  private bool AttachClipboardImage()
                  {
                      try
                      {
                          if (!Clipboard.ContainsImage()) { _aiStatusText.Text = "No image found on the clipboard. Copy a screenshot first."; return false; }
                          BitmapSource source = Clipboard.GetImage();
                          if (source == null) return false;
                          double scale = Math.Min(1.0, 1800.0 / Math.Max(source.PixelWidth, source.PixelHeight));
                          BitmapSource prepared = source;
                          if (scale < 1.0) { var transformed = new TransformedBitmap(source, new ScaleTransform(scale, scale)); transformed.Freeze(); prepared = transformed; }
                          byte[] data; string mime = "image/png";
                          var png = new PngBitmapEncoder(); png.Frames.Add(BitmapFrame.Create(prepared));
                          using (var ms = new MemoryStream()) { png.Save(ms); data = ms.ToArray(); }
                          if (data.Length > 7 * 1024 * 1024)
                          {
                              var jpeg = new JpegBitmapEncoder { QualityLevel = 86 }; jpeg.Frames.Add(BitmapFrame.Create(prepared));
                              using (var ms = new MemoryStream()) { jpeg.Save(ms); data = ms.ToArray(); }
                              mime = "image/jpeg";
                          }
                          if (data.Length > 7 * 1024 * 1024) { Array.Clear(data, 0, data.Length); _aiStatusText.Text = "Image is too large. Try copying a smaller screenshot."; return false; }
                          ClearPendingAiImage();
                          _pendingAiImageBytes = data; _pendingAiImageMimeType = mime;
                          _aiPreviewImage.Source = CreateImageFromBytes(data);
                          _aiImagePreviewPanel.Visibility = Visibility.Visible;
                          _aiStatusText.Text = "IMAGE ATTACHED  •  Sent only when you submit";
                          return true;
                      }
                      catch (Exception ex) { _aiStatusText.Text = "Could not read clipboard image: " + ex.Message; return false; }
                  }

                  private static BitmapSource CreateImageFromBytes(byte[] bytes)
                  {
                      var bitmap = new BitmapImage();
                      using (var ms = new MemoryStream(bytes))
                      {
                          bitmap.BeginInit(); bitmap.CacheOption = BitmapCacheOption.OnLoad; bitmap.StreamSource = ms; bitmap.EndInit(); bitmap.Freeze();
                      }
                      return bitmap;
                  }

                  private async Task<string> AskGeminiStreamingAsync(List<AiChatMessage> history, CancellationToken token, Action<string> onText)
                  {
                      string apiKey = LoadAiApiKey();
                      if (string.IsNullOrWhiteSpace(apiKey))
                          throw new InvalidOperationException("No API key is saved. Open Settings → AI, paste your Google Gemini API key, save it, and enable AI answers.");
                      string model = string.IsNullOrWhiteSpace(_config.AiModel) ? "gemini-3.5-flash-lite" : _config.AiModel.Trim();
                      if (model.StartsWith("models/", StringComparison.OrdinalIgnoreCase)) model = model.Substring("models/".Length);
                      string url = "https://generativelanguage.googleapis.com/v1beta/models/" + Uri.EscapeDataString(model) + ":streamGenerateContent?alt=sse";

                      var thinkingConfig = new Dictionary<string, object>();
                      if (model.StartsWith("gemini-2.5", StringComparison.OrdinalIgnoreCase))
                          thinkingConfig["thinkingBudget"] = model.IndexOf("pro", StringComparison.OrdinalIgnoreCase) >= 0 ? 128 : 0;
                      else if (model.IndexOf("3.8", StringComparison.OrdinalIgnoreCase) >= 0 || model.IndexOf("3.7", StringComparison.OrdinalIgnoreCase) >= 0 || model.StartsWith("gemini-4", StringComparison.OrdinalIgnoreCase))
                          thinkingConfig["thinkingLevel"] = "low";
                      else thinkingConfig["thinkingLevel"] = "minimal";

                      var generationConfig = new Dictionary<string, object>
                      {
                          { "temperature", 0.35 }, { "maxOutputTokens", 2048 }, { "thinkingConfig", thinkingConfig }
                      };
                      var contents = new List<object>();
                      foreach (AiChatMessage m in history)
                      {
                          var parts = new List<object>();
                          if (m.Role == "user")
                          {
                              string guidance = "Answer helpfully and clearly. Prefer concise explanations with Markdown headings, short lists, and code blocks when useful.";
                              string txt = m.Text ?? "";
                              if (!string.IsNullOrWhiteSpace(txt)) parts.Add(new Dictionary<string, object> { { "text", guidance + "\n\nUser message: " + txt } });
                              else if (m.ImageData == null) parts.Add(new Dictionary<string, object> { { "text", guidance } });
                          }
                          else if (!string.IsNullOrWhiteSpace(m.Text))
                              parts.Add(new Dictionary<string, object> { { "text", m.Text } });

                          if (m.ImageData != null && m.ImageData.Length > 0)
                              parts.Add(new Dictionary<string, object> { { "inlineData", new Dictionary<string, object> { { "mimeType", string.IsNullOrWhiteSpace(m.MimeType) ? "image/png" : m.MimeType }, { "data", Convert.ToBase64String(m.ImageData) } } } });
                          if (parts.Count == 0) continue;
                          contents.Add(new Dictionary<string, object> { { "role", m.Role == "model" ? "model" : "user" }, { "parts", parts.ToArray() } });
                      }
                      var requestBody = new Dictionary<string, object> { { "contents", contents.ToArray() }, { "generationConfig", generationConfig } };
                      var jsonSerializer = new JavaScriptSerializer { MaxJsonLength = 20 * 1024 * 1024 };
                      string json = jsonSerializer.Serialize(requestBody);
                      using (var request = new HttpRequestMessage(HttpMethod.Post, url))
                      {
                          request.Headers.Add("x-goog-api-key", apiKey);
                          request.Content = new StringContent(json, Encoding.UTF8, "application/json");
                          using (HttpResponseMessage response = await _httpClient.SendAsync(request, HttpCompletionOption.ResponseHeadersRead, token).ConfigureAwait(false))
                          {
                              if (!response.IsSuccessStatusCode)
                              {
                                  string body = await response.Content.ReadAsStringAsync().ConfigureAwait(false);
                                  string message = "Gemini returned " + (int)response.StatusCode + " (" + response.ReasonPhrase + ").";
                                  try
                                  {
                                      var root = new JavaScriptSerializer().DeserializeObject(body) as Dictionary<string, object>;
                                      var error = root != null && root.ContainsKey("error") ? root["error"] as Dictionary<string, object> : null;
                                      if (error != null && error.ContainsKey("message")) message += " " + Convert.ToString(error["message"]);
                                  }
                                  catch { }
                                  throw new InvalidOperationException(message);
                              }
                              using (Stream stream = await response.Content.ReadAsStreamAsync().ConfigureAwait(false))
                              using (var reader = new StreamReader(stream))
                              {
                                  while (true)
                                  {
                                      token.ThrowIfCancellationRequested();
                                      string line = await reader.ReadLineAsync().ConfigureAwait(false);
                                      if (line == null) break;
                                      if (!line.StartsWith("data:", StringComparison.OrdinalIgnoreCase)) continue;
                                      string payload = line.Substring(5).Trim();
                                      if (payload.Length == 0 || payload == "[DONE]") continue;
                                      string chunk = ExtractGeminiStreamText(payload);
                                      if (!string.IsNullOrEmpty(chunk)) onText(chunk);
                                  }
                              }
                          }
                      }
                      token.ThrowIfCancellationRequested();
                      return "";
                  }

                  private static string ExtractGeminiStreamText(string json)
                  {
                      try
                      {
                          var root = new JavaScriptSerializer().DeserializeObject(json) as Dictionary<string, object>;
                          var candidates = root != null && root.ContainsKey("candidates") ? root["candidates"] as System.Collections.IList : null;
                          if (candidates == null) return "";
                          var output = new StringBuilder();
                          foreach (object co in candidates)
                          {
                              var candidate = co as Dictionary<string, object>;
                              var content = candidate != null && candidate.ContainsKey("content") ? candidate["content"] as Dictionary<string, object> : null;
                              var parts = content != null && content.ContainsKey("parts") ? content["parts"] as System.Collections.IList : null;
                              if (parts == null) continue;
                              foreach (object po in parts)
                              {
                                  var part = po as Dictionary<string, object>;
                                  if (part != null && part.ContainsKey("text")) output.Append(Convert.ToString(part["text"]));
                              }
                          }
                          return output.ToString();
                      }
                      catch { return ""; }
                  }

                  private void RenderAiMarkdown(string markdown)
                  {
                      RenderAiMarkdownInto(_aiContent, markdown, true);
                  }

                  private void RenderAiMarkdownInto(StackPanel target, string markdown, bool clearTarget)
                  {
                      if (target == null) return;
                      if (clearTarget) target.Children.Clear();
                      string fence = new string((char)96, 3);
                      bool inCode = false;
                      var code = new StringBuilder();
                      Action flushCode = () =>
                      {
                          var codeBorder = new Border
                          {
                              CornerRadius = new CornerRadius(9),
                              Background = _isLightTheme ? new SolidColorBrush(Color.FromRgb(237, 240, 245)) : new SolidColorBrush(Color.FromRgb(31, 34, 42)),
                              BorderBrush = new SolidColorBrush(Color.FromArgb(45, 135, 145, 165)),
                              BorderThickness = new Thickness(1), Padding = new Thickness(12), Margin = new Thickness(0, 4, 0, 8)
                          };
                          codeBorder.Child = new TextBlock
                          {
                              Text = code.ToString().TrimEnd(), FontFamily = new FontFamily("Consolas"),
                              FontSize = 11.5, Foreground = _primaryTextBrush, TextWrapping = TextWrapping.Wrap
                          };
                          target.Children.Add(codeBorder);
                          code.Clear();
                      };

                      string[] lines = (markdown ?? "").Replace("\r", "").Split('\n');
                      foreach (string rawLine in lines.Take(240))
                      {
                          string line = rawLine.TrimEnd();
                          if (line.TrimStart().StartsWith(fence, StringComparison.Ordinal))
                          {
                              if (inCode) flushCode();
                              inCode = !inCode;
                              continue;
                          }
                          if (inCode) { code.AppendLine(line); continue; }
                          if (string.IsNullOrWhiteSpace(line))
                          {
                              target.Children.Add(new Border { Height = 4 });
                              continue;
                          }

                          string clean = line.TrimStart();
                          int headingLevel = 0;
                          while (headingLevel < clean.Length && headingLevel < 3 && clean[headingLevel] == '#') headingLevel++;
                          if (headingLevel > 0 && clean.Length > headingLevel && clean[headingLevel] == ' ')
                              clean = clean.Substring(headingLevel + 1);
                          bool bullet = clean.StartsWith("- ") || clean.StartsWith("* ") || clean.StartsWith("• ");
                          bool numbered = clean.Length > 2 && char.IsDigit(clean[0]) && clean.IndexOf(". ", StringComparison.Ordinal) == 1;
                          if (bullet || numbered) clean = clean.Substring(bullet ? 2 : 3);

                          var lineBlock = new TextBlock
                          {
                              FontSize = headingLevel == 1 ? 18 : (headingLevel == 2 ? 15 : (headingLevel == 3 ? 13.5 : 12.5)),
                              FontWeight = headingLevel > 0 || bullet || numbered ? FontWeights.SemiBold : FontWeights.Normal,
                              Foreground = _primaryTextBrush, TextWrapping = TextWrapping.Wrap,
                              Margin = new Thickness(0, headingLevel > 0 ? 7 : 2, 0, headingLevel > 0 ? 3 : 2),
                              LineHeight = headingLevel > 0 ? 25 : 20
                          };
                          if (bullet) lineBlock.Inlines.Add(new Run("•  "));
                          else if (numbered)
                          {
                              string raw = rawLine.TrimStart();
                              lineBlock.Inlines.Add(new Run(raw.Substring(0, raw.IndexOf(". ", StringComparison.Ordinal) + 2) + " "));
                          }
                          AddMarkdownInlines(lineBlock, clean);
                          target.Children.Add(lineBlock);
                      }
                      if (inCode) flushCode();
                  }

                  private void AddMarkdownInlines(TextBlock block, string text)
                  {
                      int i = 0;
                      while (i < text.Length)
                      {
                          int nextBold = text.IndexOf("**", i, StringComparison.Ordinal);
                          if (nextBold < 0) { block.Inlines.Add(new Run(text.Substring(i))); break; }
                          if (nextBold > i) block.Inlines.Add(new Run(text.Substring(i, nextBold - i)));
                          int endBold = text.IndexOf("**", nextBold + 2, StringComparison.Ordinal);
                          if (endBold < 0) { block.Inlines.Add(new Run(text.Substring(nextBold))); break; }
                          block.Inlines.Add(new Run(text.Substring(nextBold + 2, endBold - nextBold - 2)) { FontWeight = FontWeights.Bold });
                          i = endBold + 2;
                      }
                  }

                  private void AddOrUpdateShortcut()
                  {
                      string name = (_aliasNameBox == null ? "" : _aliasNameBox.Text).Trim();
                      string target = (_aliasTargetBox == null ? "" : _aliasTargetBox.Text).Trim();
                      if (string.IsNullOrWhiteSpace(name) || string.IsNullOrWhiteSpace(target))
                      {
                          MessageBox.Show("Enter both a shortcut name and its website or app path.", "Shortcut needs two values", MessageBoxButton.OK, MessageBoxImage.Information);
                          return;
                      }
                      if (name.Any(char.IsWhiteSpace))
                      {
                          MessageBox.Show("Use one command word, such as gem or work.", "Use one command word", MessageBoxButton.OK, MessageBoxImage.Information);
                          return;
                      }
                      _shortcuts.RemoveAll(x => string.Equals(x.Name, name, StringComparison.OrdinalIgnoreCase));
                      _shortcuts.Insert(0, new ShortcutAlias { Name = name, Target = target });
                      SaveShortcuts();
                      _aliasNameBox.Clear();
                      _aliasTargetBox.Clear();
                      UpdateShortcutList();
                  }

                  private void UpdateShortcutList()
                  {
                      if (_shortcutList == null) return;
                      _shortcutList.Children.Clear();
                      if (_shortcuts.Count == 0)
                      {
                          _shortcutList.Children.Add(CreateSettingsInfo("No custom commands yet. Add one above."));
                          return;
                      }
                      foreach (var alias in _shortcuts.Take(30).ToList())
                      {
                          var row = new Grid { Margin = new Thickness(0, 3, 0, 3) };
                          row.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(85) });
                          row.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                          row.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                          var name = new TextBlock
                          {
                              Text = alias.Name, FontSize = 11.5, FontWeight = FontWeights.Bold,
                              Foreground = _primaryTextBrush, VerticalAlignment = VerticalAlignment.Center
                          };
                          Grid.SetColumn(name, 0);
                          row.Children.Add(name);
                          var target = new TextBlock
                          {
                              Text = alias.Target, FontSize = 10.5, Foreground = _secondaryTextBrush,
                              TextTrimming = TextTrimming.CharacterEllipsis, VerticalAlignment = VerticalAlignment.Center
                          };
                          Grid.SetColumn(target, 1);
                          row.Children.Add(target);
                          string aliasName = alias.Name;
                          var remove = new Button
                          {
                              Content = "Remove", FontSize = 10.5, Foreground = _primaryTextBrush,
                              Background = Brushes.Transparent, BorderThickness = new Thickness(1),
                              BorderBrush = new SolidColorBrush(Color.FromArgb(70, 145, 155, 175)),
                              Padding = new Thickness(8, 3, 8, 3), Margin = new Thickness(6, 0, 0, 0), Cursor = Cursors.Hand
                          };
                          remove.Click += (s, e) =>
                          {
                              _shortcuts.RemoveAll(x => string.Equals(x.Name, aliasName, StringComparison.OrdinalIgnoreCase));
                              SaveShortcuts();
                              UpdateShortcutList();
                          };
                          Grid.SetColumn(remove, 2);
                          row.Children.Add(remove);
                          _shortcutList.Children.Add(row);
                      }
                  }

                  private void ChooseSearchFolder()
                  {
                      using (var dialog = new Forms.FolderBrowserDialog())
                      {
                          dialog.Description = "Choose the folder to search when you type 'folder ...'.";
                          dialog.ShowNewFolderButton = false;
                          if (Directory.Exists(_config.SearchFolderPath)) dialog.SelectedPath = _config.SearchFolderPath;
                          if (dialog.ShowDialog() == Forms.DialogResult.OK && Directory.Exists(dialog.SelectedPath))
                          {
                              _config.SearchFolderPath = dialog.SelectedPath;
                              _config.Save();
                              _folderCache = null;
                              _folderCachePath = "";
                              if (_folderPathText != null) _folderPathText.Text = dialog.SelectedPath;
                          }
                      }
                  }

                  private string AiKeyPath => Path.Combine(AppConfig.FolderPath, "gemini.key");

                  private bool HasSavedAiKey()
                  {
                      try { return File.Exists(AiKeyPath) && new FileInfo(AiKeyPath).Length > 0; }
                      catch { return false; }
                  }

                  private string LoadAiApiKey()
                  {
                      try
                      {
                          if (!File.Exists(AiKeyPath)) return "";
                          byte[] encrypted = File.ReadAllBytes(AiKeyPath);
                          return Encoding.UTF8.GetString(ProtectedData.Unprotect(encrypted, null, DataProtectionScope.CurrentUser));
                      }
                      catch { return ""; }
                  }

                  private void SaveAiSettings()
                  {
                      string model = _aiModelBox == null ? "" : _aiModelBox.Text.Trim();
                      if (!string.IsNullOrWhiteSpace(model)) _config.AiModel = model;
                      string key = _aiKeyBox == null ? "" : _aiKeyBox.Password.Trim();
                      try
                      {
                          Directory.CreateDirectory(AppConfig.FolderPath);
                          if (!string.IsNullOrWhiteSpace(key))
                          {
                              File.WriteAllBytes(AiKeyPath, ProtectedData.Protect(Encoding.UTF8.GetBytes(key), null, DataProtectionScope.CurrentUser));
                              _aiKeyBox.Clear();
                          }
                          _config.Save();
                          if (_aiKeyStatusText != null)
                              _aiKeyStatusText.Text = HasSavedAiKey()
                                  ? "Saved. The API key is encrypted for this Windows user."
                                  : "Model saved. Add an API key to enable requests.";
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("Could not save AI settings: " + ex.Message, "AI settings", MessageBoxButton.OK, MessageBoxImage.Warning);
                      }
                  }

                  private void RemoveAiKey()
                  {
                      try
                      {
                          if (File.Exists(AiKeyPath)) File.Delete(AiKeyPath);
                          if (_aiKeyBox != null) _aiKeyBox.Clear();
                          if (_aiKeyStatusText != null) _aiKeyStatusText.Text = "Saved API key removed.";
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("Could not remove the saved key: " + ex.Message, "AI settings", MessageBoxButton.OK, MessageBoxImage.Warning);
                      }
                  }

                  private static string EncodeField(string value)
                  {
                      return Convert.ToBase64String(Encoding.UTF8.GetBytes(value ?? ""));
                  }

                  private static string DecodeField(string value)
                  {
                      try { return Encoding.UTF8.GetString(Convert.FromBase64String(value ?? "")); }
                      catch { return ""; }
                  }

                  private string ShortcutFilePath => Path.Combine(AppConfig.FolderPath, "shortcuts.dat");
                  private string FavoritesFilePath => Path.Combine(AppConfig.FolderPath, "favorites.dat");

                  private void LoadShortcuts()
                  {
                      _shortcuts.Clear();
                      try
                      {
                          if (!File.Exists(ShortcutFilePath)) return;
                          foreach (string line in File.ReadAllLines(ShortcutFilePath))
                          {
                              string[] parts = line.Split('|');
                              if (parts.Length != 2) continue;
                              string name = DecodeField(parts[0]);
                              string target = DecodeField(parts[1]);
                              if (!string.IsNullOrWhiteSpace(name) && !string.IsNullOrWhiteSpace(target))
                                  _shortcuts.Add(new ShortcutAlias { Name = name, Target = target });
                          }
                      }
                      catch { }
                  }

                  private void SaveShortcuts()
                  {
                      try
                      {
                          Directory.CreateDirectory(AppConfig.FolderPath);
                          File.WriteAllLines(ShortcutFilePath, _shortcuts.Select(x => EncodeField(x.Name) + "|" + EncodeField(x.Target)));
                      }
                      catch { }
                  }

                  private void LoadFavorites()
                  {
                      _favorites.Clear();
                      try
                      {
                          if (!File.Exists(FavoritesFilePath)) return;
                          foreach (string line in File.ReadAllLines(FavoritesFilePath))
                          {
                              string[] parts = line.Split('|');
                              if (parts.Length != 4) continue;
                              string title = DecodeField(parts[0]);
                              string target = DecodeField(parts[1]);
                              if (string.IsNullOrWhiteSpace(title) || string.IsNullOrWhiteSpace(target)) continue;
                              _favorites.Add(new FavoriteEntry
                              {
                                  Title = title, TargetPath = target, Category = DecodeField(parts[2]), Emoji = DecodeField(parts[3])
                              });
                          }
                      }
                      catch { }
                  }

                  private void SaveFavorites()
                  {
                      try
                      {
                          Directory.CreateDirectory(AppConfig.FolderPath);
                          File.WriteAllLines(FavoritesFilePath, _favorites.Select(x =>
                              EncodeField(x.Title) + "|" + EncodeField(x.TargetPath) + "|" + EncodeField(x.Category) + "|" + EncodeField(x.Emoji)));
                      }
                      catch { }
                  }

                  private string ResolveTarget(string target)
                  {
                      if (string.IsNullOrWhiteSpace(target)) return "";
                      string value = target.Trim();
                      Uri uri;
                      if (Uri.TryCreate(value, UriKind.Absolute, out uri) &&
                          (uri.Scheme == Uri.UriSchemeHttp || uri.Scheme == Uri.UriSchemeHttps))
                          return uri.AbsoluteUri;
                      bool executableName = value.EndsWith(".exe", StringComparison.OrdinalIgnoreCase) ||
                                            value.EndsWith(".lnk", StringComparison.OrdinalIgnoreCase) ||
                                            value.EndsWith(".bat", StringComparison.OrdinalIgnoreCase) ||
                                            value.EndsWith(".cmd", StringComparison.OrdinalIgnoreCase) ||
                                            value.EndsWith(".url", StringComparison.OrdinalIgnoreCase);
                      if (!executableName && !Path.IsPathRooted(value) && !File.Exists(value) && !Directory.Exists(value) &&
                          !value.Contains(" ") && value.Contains("."))
                          return "https://" + value;
                      return value;
                  }

                  private bool IsFavorite(SearchItem item)
                  {
                      return item != null && !string.IsNullOrWhiteSpace(item.TargetPath) && item.CustomAction == null &&
                          _favorites.Any(x => string.Equals(x.TargetPath, ResolveTarget(item.TargetPath), StringComparison.OrdinalIgnoreCase));
                  }

                  private void ToggleFavorite(SearchItem item)
                  {
                      if (item == null || string.IsNullOrWhiteSpace(item.TargetPath) || item.CustomAction != null) return;
                      string target = ResolveTarget(item.TargetPath);
                      var existing = _favorites.FirstOrDefault(x => string.Equals(x.TargetPath, target, StringComparison.OrdinalIgnoreCase));
                      if (existing != null) _favorites.Remove(existing);
                      else _favorites.Insert(0, new FavoriteEntry { Title = item.Title, TargetPath = target, Category = item.Category, Emoji = item.Emoji });
                      if (_favorites.Count > 100) _favorites = _favorites.Take(100).ToList();
                      SaveFavorites();
                      if (_searchBox != null && _searchBox.Text.Trim().StartsWith("fav", StringComparison.OrdinalIgnoreCase))
                      {
                          string q = _searchBox.Text.Trim();
                          RenderFavoritesBoard(q.Length > 3 ? q.Substring(4).Trim() : "");
                      }
                      UpdateShortcutList();
                      if (_searchBox != null) UpdateResults(_searchBox.Text);
                  }

                  private void LaunchTarget(string target, bool runAsAdmin, bool openFolder, bool hideSearch)
                  {
                      string resolved = ResolveTarget(target);
                      if (string.IsNullOrWhiteSpace(resolved)) return;
                      if (hideSearch) HideSearch();
                      try
                      {
                          if (openFolder && File.Exists(resolved))
                              Process.Start("explorer.exe", "/select,\"" + resolved + "\"");
                          else if (runAsAdmin)
                              Process.Start(new ProcessStartInfo(resolved) { UseShellExecute = true, Verb = "runas" });
                          else
                              Process.Start(new ProcessStartInfo(resolved) { UseShellExecute = true });
                      }
                      catch { }
                  }

                  private List<SearchItem> GetFolderSearchResults(string query)
                  {
                      string path = _config.SearchFolderPath;
                      if (string.IsNullOrWhiteSpace(path) || !Directory.Exists(path)) return new List<SearchItem>();
                      bool stale = _folderCache == null ||
                          !string.Equals(_folderCachePath, path, StringComparison.OrdinalIgnoreCase) ||
                          DateTime.Now - _folderCacheLoadedAt > TimeSpan.FromSeconds(45);
                      if (stale)
                      {
                          _folderCache = new List<SearchItem>();
                          _folderCachePath = path;
                          _folderCacheLoadedAt = DateTime.Now;
                          SearchOption option = _config.IncludeSubfolders ? SearchOption.AllDirectories : SearchOption.TopDirectoryOnly;
                          try
                          {
                              foreach (string file in Directory.EnumerateFiles(path, "*", option))
                              {
                                  _folderCache.Add(new SearchItem { Title = Path.GetFileName(file), Subtitle = file, TargetPath = file, Category = "FILE", Emoji = "📄" });
                                  if (_folderCache.Count >= 1500) break;
                              }
                          }
                          catch { }
                          try
                          {
                              foreach (string dir in Directory.EnumerateDirectories(path, "*", option))
                              {
                                  _folderCache.Add(new SearchItem { Title = Path.GetFileName(dir), Subtitle = dir, TargetPath = dir, Category = "FOLDER", Emoji = "📁" });
                                  if (_folderCache.Count >= 1500) break;
                              }
                          }
                          catch { }
                      }
                      string needle = (query ?? "").Trim();
                      return _folderCache
                          .Where(x => string.IsNullOrEmpty(needle) ||
                              x.Title.IndexOf(needle, StringComparison.OrdinalIgnoreCase) >= 0 ||
                              x.Subtitle.IndexOf(needle, StringComparison.OrdinalIgnoreCase) >= 0)
                          .OrderByDescending(x => x.Title.StartsWith(needle, StringComparison.OrdinalIgnoreCase))
                          .ThenBy(x => x.Title.Length)
                          .Take(8)
                          .ToList();
                  }

                  private void RenderNotesBoard(string filterText)
                  {
                      _notesContainer.Children.Clear();
                      var list = _notes.AsEnumerable();
                      if (!string.IsNullOrWhiteSpace(filterText))
                          list = list.Where(n => n.Text.IndexOf(filterText, StringComparison.OrdinalIgnoreCase) >= 0);

                      var notesList = list.ToList();
                      if (notesList.Count == 0)
                      {
                          _notesContainer.Children.Add(new Border
                          {
                              CornerRadius = new CornerRadius(10),
                              Background = new SolidColorBrush(Color.FromArgb(22, 255, 255, 255)),
                              Padding = new Thickness(16, 18, 16, 18),
                              Child = new TextBlock
                              {
                                  Text = "No sticky notes yet. Type 'note Buy coffee at 5pm' above and hit Enter!",
                                  Foreground = _secondaryTextBrush,
                                  FontSize = 13,
                                  HorizontalAlignment = HorizontalAlignment.Center
                              }
                          });
                          return;
                      }

                      // Gradient pairs for vibrant sticky note cards
                      Color[][] cardGradients = new Color[][]
                      {
                          new[] { Color.FromArgb(65, 59, 130, 246), Color.FromArgb(35, 37, 99, 235) },
                          new[] { Color.FromArgb(65, 168, 85, 247), Color.FromArgb(35, 126, 34, 206) },
                          new[] { Color.FromArgb(65, 16, 185, 129), Color.FromArgb(35, 5, 150, 105) },
                          new[] { Color.FromArgb(65, 245, 158, 11), Color.FromArgb(35, 217, 119, 6) }
                      };

                      foreach (var note in notesList)
                      {
                          var pal = cardGradients[Math.Abs(note.ColorIndex) % cardGradients.Length];
                          var card = new Border
                          {
                              CornerRadius = new CornerRadius(12),
                              Background = new LinearGradientBrush(pal[0], pal[1], 25),
                              BorderBrush = new SolidColorBrush(Color.FromArgb(75, 255, 255, 255)),
                              BorderThickness = new Thickness(1),
                              Padding = new Thickness(14, 10, 14, 10),
                              Margin = new Thickness(0, 0, 0, 8)
                          };

                          var g = new Grid();
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                          var tStack = new StackPanel();
                          tStack.Children.Add(new TextBlock
                          {
                              Text = note.Text,
                              Foreground = Brushes.White,
                              FontSize = 14,
                              FontWeight = FontWeights.Medium,
                              TextWrapping = TextWrapping.Wrap
                          });
                          tStack.Children.Add(new TextBlock
                          {
                              Text = "🕒 " + note.Timestamp,
                              Foreground = new SolidColorBrush(Color.FromRgb(185, 195, 215)),
                              FontSize = 10,
                              Margin = new Thickness(0, 4, 0, 0)
                          });
                          Grid.SetColumn(tStack, 0);

                          var copyBtn = new Button
                          {
                              Content = "📋 Copy",
                              FontSize = 11,
                              Foreground = Brushes.White,
                              Background = new SolidColorBrush(Color.FromArgb(45, 0, 0, 0)),
                              BorderThickness = new Thickness(0),
                              Padding = new Thickness(8, 4, 8, 4),
                              Margin = new Thickness(8, 0, 4, 0),
                              VerticalAlignment = VerticalAlignment.Center,
                              Cursor = Cursors.Hand
                          };
                          string noteCopy = note.Text;
                          copyBtn.Click += (s, e) =>
                          {
                              try { Clipboard.SetText(noteCopy); } catch { }
                              HideSearch();
                          };
                          Grid.SetColumn(copyBtn, 1);

                          var delBtn = new Button
                          {
                              Content = "✕",
                              FontSize = 12,
                              Foreground = new SolidColorBrush(Color.FromRgb(255, 140, 140)),
                              Background = new SolidColorBrush(Color.FromArgb(45, 0, 0, 0)),
                              BorderThickness = new Thickness(0),
                              Padding = new Thickness(8, 4, 8, 4),
                              VerticalAlignment = VerticalAlignment.Center,
                              Cursor = Cursors.Hand
                          };
                          string noteId = note.Id;
                          delBtn.Click += (s, e) =>
                          {
                              _notes.RemoveAll(x => x.Id == noteId);
                              SaveNotes();
                              RenderNotesBoard("");
                          };
                          Grid.SetColumn(delBtn, 2);

                          g.Children.Add(tStack);
                          g.Children.Add(copyBtn);
                          g.Children.Add(delBtn);
                          card.Child = g;
                          _notesContainer.Children.Add(card);
                      }
                  }

