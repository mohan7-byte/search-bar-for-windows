                  }

                  private TextBlock CreateSettingsLabel(string text)
                  {
                      return new TextBlock { Text = text, FontSize = 11.5, FontWeight = FontWeights.SemiBold, Foreground = _primaryTextBrush };
                  }

                  private TextBlock CreateSettingsInfo(string text)
                  {
                      return new TextBlock
                      {
                          Text = text, FontSize = 11, Foreground = _secondaryTextBrush,
                          TextWrapping = TextWrapping.Wrap, Margin = new Thickness(0, 2, 0, 5), Tag = "muted"
                      };
