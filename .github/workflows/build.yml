                  private UIElement CreateSliderRow(string label, double min, double max, double current, Action<double> onChanged)
                  {
                      var g = new Grid { Margin = new Thickness(0, 3, 0, 3) };
                      g.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(175) });
                      g.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                      g.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(45) });

                      var tb = new TextBlock
                      {
                          Text = label,
                          Foreground = _primaryTextBrush,
                          FontSize = 12,
                          VerticalAlignment = VerticalAlignment.Center
                      };
                      Grid.SetColumn(tb, 0);

                      var valText = new TextBlock
                      {
                          Text = Math.Round(current).ToString(),
                          Foreground = _primaryTextBrush,
                          FontSize = 12,
                          HorizontalAlignment = HorizontalAlignment.Right,
                          VerticalAlignment = VerticalAlignment.Center
                      };
                      Grid.SetColumn(valText, 2);

                      var slider = new Slider
                      {
                          Minimum = min,
                          Maximum = max,
                          Value = current,
                          VerticalAlignment = VerticalAlignment.Center,
                          Cursor = Cursors.Hand
                      };
                      slider.ValueChanged += (s, e) =>
                      {
                          valText.Text = Math.Round(slider.Value).ToString();
                          onChanged(slider.Value);
                      };
                      Grid.SetColumn(slider, 1);

                      g.Children.Add(tb);
                      g.Children.Add(slider);
                      g.Children.Add(valText);
                      return g;
                  }

                  private CheckBox CreateToggle(string label, bool initial, Action<bool> onChanged)
                  {
                      var cb = new CheckBox
                      {
                          Content = new TextBlock
                          {
                              Text = label,
                              Foreground = _primaryTextBrush,
                              FontSize = 12.5
                          },
                          IsChecked = initial,
                          Margin = new Thickness(0, 3, 0, 3),
                          Cursor = Cursors.Hand
                      };
                      cb.Checked += (s, e) => onChanged(true);
                      cb.Unchecked += (s, e) => onChanged(false);
                      return cb;
                  }

                  private bool IsWindowsAppsLightTheme()
                  {
                      try
                      {
                          using (var key = Registry.CurrentUser.OpenSubKey(@"Software\Microsoft\Windows\CurrentVersion\Themes\Personalize", false))
                          {
                              object value = key == null ? null : key.GetValue("AppsUseLightTheme");
                              if (value is int) return (int)value == 1;
                          }
                      }
                      catch { }
                      return false;
                  }

                  private byte[] GetActiveThemePalette()
                  {
                      int t = Math.Max(0, Math.Min(_themes.Length - 1, _config.ThemeIndex));
                      if (t == 0) return _themes[IsWindowsAppsLightTheme() ? 1 : 2];
                      return _themes[t];
                  }

                  private void ApplyThemeAndGeometry()
                  {
                      int t = Math.Max(0, Math.Min(_themes.Length - 1, _config.ThemeIndex));
                      _isLightTheme = t == 1 || (t == 0 && IsWindowsAppsLightTheme());
                      byte[] p = t == 0 ? _themes[_isLightTheme ? 1 : 2] : _themes[t];
                      byte bgAlpha = _config.EnableAcrylic ? (byte)205 : (byte)248;

                      _primaryTextBrush = _isLightTheme
                          ? new SolidColorBrush(Color.FromRgb(32, 35, 40))
                          : Brushes.White;
                      _secondaryTextBrush = _isLightTheme
                          ? new SolidColorBrush(Color.FromRgb(92, 98, 108))
                          : new SolidColorBrush(Color.FromRgb(150, 155, 172));
                      _settingsPanelBrush = _isLightTheme
                          ? new SolidColorBrush(Color.FromArgb(248, 246, 248, 251))
                          : new SolidColorBrush(Color.FromArgb(215, 16, 17, 22));

                      _mainBorder.Background = new SolidColorBrush(Color.FromArgb(bgAlpha, p[0], p[1], p[2]));
                      _mainBorder.BorderBrush = new SolidColorBrush(Color.FromArgb(p[6], p[3], p[4], p[5]));
                      _mainBorder.CornerRadius = new CornerRadius(_config.CornerRadiusVal);

                      var accentBrush = new SolidColorBrush(Color.FromRgb(p[3], p[4], p[5]));
                      _searchIcon.Foreground = accentBrush;
                      _searchBox.CaretBrush = accentBrush;
                      _searchBox.Foreground = _primaryTextBrush;
                      _settingsPanel.Background = _settingsPanelBrush;
                      _settingsPanel.BorderBrush = new SolidColorBrush(_isLightTheme
                          ? Color.FromArgb(70, 40, 45, 55)
                          : Color.FromArgb(45, 255, 255, 255));

                      UpdateResults(_searchBox.Text);

                      Width = _config.WindowWidth;
                      Left = (SystemParameters.PrimaryScreenWidth - Width) * (_config.PosXPercent / 100.0);
                      Top = (SystemParameters.PrimaryScreenHeight - 120) * (_config.PosYPercent / 100.0);
                  }

                  private ImageSource GetRealFileIcon(string path)
                  {
                      if (string.IsNullOrEmpty(path)) return null;
                      ImageSource cached;
                      if (_iconCache.TryGetValue(path, out cached)) return cached;
                      try
                      {
                          if (File.Exists(path))
                          {
                              using (var sysIcon = System.Drawing.Icon.ExtractAssociatedIcon(path))
                              {
                                  if (sysIcon != null)
                                  {
                                      var img = Imaging.CreateBitmapSourceFromHIcon(
                                          sysIcon.Handle,
                                          Int32Rect.Empty,
                                          BitmapSizeOptions.FromWidthAndHeight(32, 32));
                                      img.Freeze();
                                      if (_iconCache.Count > 120) _iconCache.Clear();
                                      _iconCache[path] = img;
                                      return img;
                                  }
                              }
                          }
                      }
                      catch { }
                      return null;
                  }

                  private void RefreshCaches()
                  {
                      _appCache.Clear();
                      _iconCache.Clear();
                      if (_config.SearchApps)
                      {
                          var dirs = new[]
                          {
                              Environment.GetFolderPath(Environment.SpecialFolder.CommonStartMenu),
                              Environment.GetFolderPath(Environment.SpecialFolder.StartMenu)
                          };
                          var seen = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
                          foreach (var dir in dirs)
                          {
                              if (!Directory.Exists(dir)) continue;
                              try
                              {
                                  foreach (var file in Directory.EnumerateFiles(dir, "*.*", SearchOption.AllDirectories))
                                  {
                                      if (!file.EndsWith(".lnk", StringComparison.OrdinalIgnoreCase) &&
                                          !file.EndsWith(".url", StringComparison.OrdinalIgnoreCase)) continue;
                                      var name = Path.GetFileNameWithoutExtension(file);
                                      if (name.IndexOf("uninstall", StringComparison.OrdinalIgnoreCase) >= 0) continue;
                                      if (seen.Add(name))
                                      {
                                          _appCache.Add(new SearchItem
                                          {
                                              Title = name,
                                              Subtitle = "Application • Ctrl+Shift+Enter for Admin",
                                              TargetPath = file,
                                              Category = "APP"
                                          });
                                      }
                                  }
                              }
                              catch { }
                          }
                      }

                      if (_config.SearchFiles)
                      {
                          _fileCache = new List<SearchItem>();
                          var roots = new[]
                          {
                              Environment.GetFolderPath(Environment.SpecialFolder.Desktop),
                              Environment.GetFolderPath(Environment.SpecialFolder.MyDocuments)
                          };
                          foreach (var r in roots)
                          {
                              if (!Directory.Exists(r)) continue;
                              try
                              {
                                  foreach (var f in Directory.EnumerateFiles(r, "*.*", SearchOption.TopDirectoryOnly))
                                  {
                                      _fileCache.Add(new SearchItem
                                      {
                                          Title = Path.GetFileName(f),
                                          Subtitle = r,
                                          TargetPath = f,
                                          Category = "FILE"
                                      });
                                  }
                              }
                              catch { }
                          }
                      }
                      else
                      {
                          _fileCache = null;
                      }

                      if (_config.SearchSystem)
                      {
                          _sysCache = new List<SearchItem>
                          {
                              new SearchItem { Title = "Lock PC", Subtitle = "Instant Power Command", Category = "POWER", Emoji = "🔒",
                                  CustomAction = () => Process.Start("rundll32.exe", "user32.dll,LockWorkStation") },
                              new SearchItem { Title = "Empty Recycle Bin", Subtitle = "Clean temporary trash immediately", Category = "SYSTEM", Emoji = "🗑️",
                                  CustomAction = () => SHEmptyRecycleBin(IntPtr.Zero, null, 7) },
                              new SearchItem { Title = "Sleep PC", Subtitle = "Put computer into low-power sleep", Category = "POWER", Emoji = "🌙",
                                  CustomAction = () => Forms.Application.SetSuspendState(Forms.PowerState.Suspend, false, false) },
                              new SearchItem { Title = "Shutdown PC", Subtitle = "Power off Windows cleanly", Category = "POWER", Emoji = "⚡",
                                  CustomAction = () => Process.Start("shutdown.exe", "/s /t 0") },
                              new SearchItem { Title = "Restart PC", Subtitle = "Reboot Windows cleanly", Category = "POWER", Emoji = "🔄",
                                  CustomAction = () => Process.Start("shutdown.exe", "/r /t 0") },
                              new SearchItem { Title = "Task Manager", Subtitle = "System Resource Monitor", TargetPath = "taskmgr.exe", Category = "SYS", Emoji = "📊" },
                              new SearchItem { Title = "Control Panel", Subtitle = "Classic Windows Settings", TargetPath = "control.exe", Category = "SYS", Emoji = "🎛️" },
                              new SearchItem { Title = "Windows Settings", Subtitle = "Modern Settings Panel", TargetPath = "ms-settings:", Category = "SYS", Emoji = "⚙️" }
                          };
                      }
                      else
                      {
                          _sysCache = null;
                      }

                      TrimMemory();
                  }

                  private void OnSearchTextChanged(object sender, TextChangedEventArgs e)
                  {
                      _placeholderText.Visibility = string.IsNullOrEmpty(_searchBox.Text)
                          ? Visibility.Visible
                          : Visibility.Collapsed;
                      UpdateResults(_searchBox.Text);
                  }

                  private void UpdateResults(string rawQuery)
                  {
                      _resultsList.Items.Clear();
                      string q = (rawQuery ?? "").Trim();

                      if (string.IsNullOrEmpty(q))
                      {
                          _resultsList.Visibility = Visibility.Collapsed;
                          _notesBoard.Visibility = Visibility.Collapsed;
                          return;
                      }

                      // 1. Sticky Notes Mode ('notes' or 'note ...')
                      if (_config.EnableNotes && (q.Equals("notes", StringComparison.OrdinalIgnoreCase) ||
                          q.StartsWith("note ", StringComparison.OrdinalIgnoreCase)))
                      {
                          _notesBoard.Visibility = Visibility.Visible;
                          string noteBody = q.Length > 5 ? q.Substring(5).Trim() : "";
                          RenderNotesBoard("");

                          if (!string.IsNullOrEmpty(noteBody))
                          {
                              var addNoteItem = new SearchItem
                              {
                                  Title = "Pin Sticky Note: \"" + noteBody + "\"",
                                  Subtitle = "Press Enter to save to your Visual Scratchpad",
                                  Category = "NOTE",
                                  Emoji = "📌",
                                  CustomAction = () =>
                                  {
                                      _notes.Insert(0, new NoteItem
                                      {
                                          Id = Guid.NewGuid().ToString("N"),
                                          Text = noteBody,
                                          Timestamp = DateTime.Now.ToString("dd MMM, hh:mm tt"),
                                          ColorIndex = _notes.Count
                                      });
                                      SaveNotes();
                                      _searchBox.Text = "notes";
                                      _searchBox.CaretIndex = _searchBox.Text.Length;
                                  }
                              };
                              _resultsList.Items.Add(CreateResultRow(addNoteItem, 0));
                              _resultsList.SelectedIndex = 0;
                              _resultsList.Visibility = Visibility.Visible;
                          }
                          else
                          {
                              _resultsList.Visibility = Visibility.Collapsed;
                          }
                          return;
                      }
                      else
                      {
                          _notesBoard.Visibility = Visibility.Collapsed;
                      }

                      var finalItems = new List<SearchItem>();

                      // 2. Running Process Killer ('kill <name>')
                      if (_config.EnableKill && (q.Equals("kill", StringComparison.OrdinalIgnoreCase) ||
                          q.StartsWith("kill ", StringComparison.OrdinalIgnoreCase)))
                      {
                          string pFilter = q.Length > 4 ? q.Substring(4).Trim() : "";
                          try
                          {
                              var procs = Process.GetProcesses()
                                  .Where(p => !string.IsNullOrEmpty(p.MainWindowTitle) || p.ProcessName.IndexOf(pFilter, StringComparison.OrdinalIgnoreCase) >= 0)
                                  .Where(p => string.IsNullOrEmpty(pFilter) ||
                                              p.ProcessName.IndexOf(pFilter, StringComparison.OrdinalIgnoreCase) >= 0 ||
                                              p.MainWindowTitle.IndexOf(pFilter, StringComparison.OrdinalIgnoreCase) >= 0)
                                  .OrderByDescending(p => !string.IsNullOrEmpty(p.MainWindowTitle))
                                  .Take(7);

                              foreach (var proc in procs)
                              {
                                  int pid = proc.Id;
                                  string pName = proc.ProcessName;
                                  string wTitle = string.IsNullOrEmpty(proc.MainWindowTitle) ? "Background Process" : proc.MainWindowTitle;
                                  finalItems.Add(new SearchItem
                                  {
                                      Title = "Kill " + pName + " (PID: " + pid + ")",
                                      Subtitle = wTitle + " • Press Enter to force terminate",
                                      Category = "KILL",
                                      Emoji = "🛑",
                                      CustomAction = () =>
                                      {
                                          try { Process.GetProcessById(pid).Kill(); } catch { }
                                      }
                                  });
                              }
                          }
                          catch { }
                      }

                      // 3. Quick System Volume & Media Sliders ('vol 40', 'mute', 'next', 'pause')
                      if (_config.EnableKill)
                      {
                          if (q.StartsWith("vol ", StringComparison.OrdinalIgnoreCase))
                          {
                              int targetVol;
                              if (int.TryParse(q.Substring(4).Trim(), out targetVol))
                              {
                                  targetVol = Math.Max(0, Math.Min(100, targetVol));
                                  finalItems.Add(new SearchItem
                                  {
                                      Title = "Set System Volume to " + targetVol + "%",
                                      Subtitle = "Adjust master audio level immediately",
                                      Category = "AUDIO",
                                      Emoji = "🔊",
                                      CustomAction = () => SetSystemVolume(targetVol)
                                  });
                              }
                          }
                          else if (q.Equals("mute", StringComparison.OrdinalIgnoreCase))
                          {
                              finalItems.Add(new SearchItem
                              {
                                  Title = "Toggle System Audio Mute",
                                  Subtitle = "Mute or unmute master speakers",
                                  Category = "AUDIO",
                                  Emoji = "🔇",
                                  CustomAction = () => keybd_event(0xAD, 0, 0, UIntPtr.Zero)
                              });
                          }
                      }

                      // 4. Instant Math Calculator
                      if (_config.EnableCalc && LooksLikeMath(q))
                      {
                          try
                          {
                              string expr = q.Replace("%", "/100.0");
                              var val = new DataTable().Compute(expr, null);
                              if (val != null && val != DBNull.Value)
                              {
                                  string ans = Convert.ToDouble(val).ToString("0.######");
                                  finalItems.Add(new SearchItem
                                  {
                                      Title = "= " + ans,
                                      Subtitle = "Instant Math (" + q + ") • Press Enter to copy result",
                                      Category = "CALC",
                                      Emoji = "🧮",
                                      CustomAction = () =>
                                      {
                                          try { Clipboard.SetText(ans); } catch { }
                                      }
                                  });
                              }
                          }
                          catch { }
                      }

                      // 5. Apps, System & Files with Smart Most-Used Learning
                      var matches = new List<SearchItem>();
                      if (_config.SearchApps && _appCache != null)
                          matches.AddRange(_appCache.Where(x => MatchesQuery(x.Title, q)));

                      if (_config.SearchSystem && _sysCache != null)
                          matches.AddRange(_sysCache.Where(x => MatchesQuery(x.Title, q)));

                      if (_config.SearchFiles && _fileCache != null)
                          matches.AddRange(_fileCache.Where(x => MatchesQuery(x.Title, q)));

                      var sortedMatches = matches
                          .OrderByDescending(x => GetUsageScore(x.Title))
                          .ThenByDescending(x => x.Title.StartsWith(q, StringComparison.OrdinalIgnoreCase))
                          .ThenBy(x => x.Title.Length)
                          .Take(7)
                          .ToList();

                      finalItems.AddRange(sortedMatches);

                      // Direct webpage navigation: "chatgpt.com", "https://example.com", or "sea chatgpt.com".
                      string directInput = q;
                      if (directInput.StartsWith("sea ", StringComparison.OrdinalIgnoreCase))
                          directInput = directInput.Substring(4).Trim();

                      Uri directUri = null;
                      bool hasScheme = directInput.StartsWith("http://", StringComparison.OrdinalIgnoreCase) ||
                                       directInput.StartsWith("https://", StringComparison.OrdinalIgnoreCase);
                      string candidateUrl = hasScheme ? directInput : "https://" + directInput;
                      bool looksLikeDomain = !string.IsNullOrWhiteSpace(directInput) &&
                          directInput.IndexOf(' ') < 0 &&
                          directInput.IndexOf('.') > 0 &&
                          !directInput.EndsWith(".", StringComparison.Ordinal) &&
                          Uri.TryCreate(candidateUrl, UriKind.Absolute, out directUri) &&
                          (directUri.Scheme == Uri.UriSchemeHttp || directUri.Scheme == Uri.UriSchemeHttps) &&
                          directUri.Host.IndexOf('.') > 0;

                      if (looksLikeDomain)
                      {
                          finalItems.Insert(0, new SearchItem
                          {
                              Title = "Open webpage: " + directUri.Host,
                              Subtitle = "Open directly in your default browser",
                              TargetPath = directUri.AbsoluteUri,
                              Category = "URL",
                              Emoji = "🌐"
                          });
                      }

                      // 6. Web Search Fallback
                      if (_config.SearchWeb && !looksLikeDomain)
                      {
                          finalItems.Add(new SearchItem
                          {
                              Title = "Search Web for \"" + q + "\"",
                              Subtitle = "Open in default browser",
                              TargetPath = "https://www.google.com/search?q=" + Uri.EscapeDataString(q),
                              Category = "WEB",
                              Emoji = "🌐"
                          });
                      }

                      int rowIndex = 0;
                      foreach (var item in finalItems.Take(8))
                      {
                          _resultsList.Items.Add(CreateResultRow(item, rowIndex++));
                      }

                      if (_resultsList.Items.Count > 0)
                      {
                          _resultsList.SelectedIndex = 0;
                          _resultsList.Visibility = Visibility.Visible;
                      }
                      else
                      {
                          _resultsList.Visibility = Visibility.Collapsed;
                      }
                  }

                  private bool MatchesQuery(string title, string query)
                  {
                      if (title.IndexOf(query, StringComparison.OrdinalIgnoreCase) >= 0) return true;
                      // Initials / Fuzzy check (e.g. 'vsc' matches 'Visual Studio Code')
                      var words = title.Split(new[] { ' ', '-', '_' }, StringSplitOptions.RemoveEmptyEntries);
                      if (words.Length >= query.Length && query.Length >= 2)
                      {
                          string initials = new string(words.Select(w => w[0]).ToArray());
                          if (initials.IndexOf(query, StringComparison.OrdinalIgnoreCase) >= 0) return true;
                      }
                      return false;
                  }

                  private bool LooksLikeMath(string s)
                  {
                      if (!s.Any(char.IsDigit)) return false;
                      return s.IndexOfAny(new[] { '+', '-', '*', '/', '%', '(' }) >= 0;
                  }

                  private void SetSystemVolume(int level)
                  {
                      // Step down to 0 then step up to requested level (each step = 2%)
                      for (int i = 0; i < 50; i++) keybd_event(0xAE, 0, 0, UIntPtr.Zero);
                      int steps = level / 2;
                      for (int i = 0; i < steps; i++) keybd_event(0xAF, 0, 0, UIntPtr.Zero);
                  }

                  private ListBoxItem CreateResultRow(SearchItem item, int index)
                  {
                      var rowBorder = new Border
                      {
                          CornerRadius = new CornerRadius(10),
                          Background = Brushes.Transparent,
                          Padding = new Thickness(10, 7, 10, 7),
                          Margin = new Thickness(0, 2, 0, 2),
                          RenderTransform = new TranslateTransform(0, 8),
                          Opacity = 0
                      };

                      var grid = new Grid();
                      grid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                      grid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                      grid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                      // 1. Real Icon or Emoji Badge
                      UIElement iconElement = null;
                      var realIcon = GetRealFileIcon(item.TargetPath);
                      if (realIcon != null)
                      {
                          iconElement = new Image
                          {
                              Source = realIcon,
                              Width = 28,
                              Height = 28,
                              Margin = new Thickness(0, 0, 12, 0),
                              VerticalAlignment = VerticalAlignment.Center
                          };
                      }
                      else
                      {
                          iconElement = new Border
                          {
                              Width = 30,
                              Height = 30,
                              CornerRadius = new CornerRadius(8),
                              Background = new SolidColorBrush(Color.FromArgb(40, 255, 255, 255)),
                              Margin = new Thickness(0, 0, 12, 0),
                              VerticalAlignment = VerticalAlignment.Center,
                              Child = new TextBlock
                              {
                                  Text = string.IsNullOrEmpty(item.Emoji) ? "🚀" : item.Emoji,
                                  FontSize = 15,
                                  HorizontalAlignment = HorizontalAlignment.Center,
                                  VerticalAlignment = VerticalAlignment.Center
                              }
                          };
                      }
                      Grid.SetColumn(iconElement, 0);

                      // 2. Title & Subtitle
                      var leftStack = new StackPanel { VerticalAlignment = VerticalAlignment.Center };
                      int uses = GetUsageScore(item.Title);
                      string titleText = uses > 0 ? item.Title + "  ★" : item.Title;

                      leftStack.Children.Add(new TextBlock
                      {
                          Text = titleText,
                          Foreground = _primaryTextBrush,
                          FontSize = 14.5,
                          FontWeight = FontWeights.SemiBold
                      });
                      leftStack.Children.Add(new TextBlock
                      {
                          Text = item.Subtitle,
                          Foreground = _secondaryTextBrush,
                          FontSize = 11
                      });
                      Grid.SetColumn(leftStack, 1);

                      // 3. Category Pill
                      byte[] p = GetActiveThemePalette();
                      var badge = new Border
                      {
                          CornerRadius = new CornerRadius(6),
                          Background = new SolidColorBrush(Color.FromArgb(38, p[3], p[4], p[5])),
                          Padding = new Thickness(8, 3, 8, 3),
                          VerticalAlignment = VerticalAlignment.Center,
                          Child = new TextBlock
                          {
                              Text = item.Category,
                              Foreground = new SolidColorBrush(Color.FromRgb(p[3], p[4], p[5])),
                              FontSize = 10,
                              FontWeight = FontWeights.Bold
                          }
                      };
                      Grid.SetColumn(badge, 2);

                      grid.Children.Add(iconElement);
                      grid.Children.Add(leftStack);
                      grid.Children.Add(badge);
                      rowBorder.Child = grid;

                      // Smooth staggered entrance animation for each row
                      var delay = TimeSpan.FromMilliseconds(index * 18);
                      var fade = new DoubleAnimation(0, 1, TimeSpan.FromMilliseconds(140)) { BeginTime = delay };
                      var slide = new DoubleAnimation(8, 0, TimeSpan.FromMilliseconds(160))
                      {
                          BeginTime = delay,
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      };
                      rowBorder.BeginAnimation(OpacityProperty, fade);
                      rowBorder.RenderTransform.BeginAnimation(TranslateTransform.YProperty, slide);

                      return new ListBoxItem
                      {
                          Content = rowBorder,
                          Tag = item,
                          Background = Brushes.Transparent,
                          BorderThickness = new Thickness(0),
                          Padding = new Thickness(0),
                          HorizontalContentAlignment = HorizontalAlignment.Stretch,
                          Cursor = Cursors.Hand
                      };
                  }

                  private void OnResultSelectionChanged(object sender, SelectionChangedEventArgs e)
                  {
                      byte[] p = GetActiveThemePalette();

                      foreach (var obj in _resultsList.Items)
                      {
                          var lbi = obj as ListBoxItem;
                          if (lbi == null) continue;
                          var b = lbi.Content as Border;
                          if (b == null) continue;

                          if (lbi.IsSelected)
                          {
                              b.Background = new SolidColorBrush(Color.FromArgb(55, p[3], p[4], p[5]));
                              b.BorderBrush = new SolidColorBrush(Color.FromArgb(110, p[3], p[4], p[5]));
                              b.BorderThickness = new Thickness(1);
                          }
                          else
                          {
                              b.Background = Brushes.Transparent;
                              b.BorderThickness = new Thickness(0);
                          }
                      }
                  }

                  private void OnSearchKeyDown(object sender, KeyEventArgs e)
                  {
                      if (e.Key == Key.Escape)
                      {
                          HideSearch();
                          e.Handled = true;
                      }
                      else if (e.Key == Key.Down && _resultsList.Items.Count > 0)
                      {
                          _resultsList.SelectedIndex = (_resultsList.SelectedIndex + 1) % _resultsList.Items.Count;
                          _resultsList.ScrollIntoView(_resultsList.SelectedItem);
                          e.Handled = true;
                      }
                      else if (e.Key == Key.Up && _resultsList.Items.Count > 0)
                      {
                          _resultsList.SelectedIndex = (_resultsList.SelectedIndex - 1 + _resultsList.Items.Count) % _resultsList.Items.Count;
                          _resultsList.ScrollIntoView(_resultsList.SelectedItem);
                          e.Handled = true;
                      }
                      else if (e.Key == Key.Enter)
                      {
                          bool ctrl = (Keyboard.Modifiers & ModifierKeys.Control) == ModifierKeys.Control;
                          bool shift = (Keyboard.Modifiers & ModifierKeys.Shift) == ModifierKeys.Shift;
                          ExecuteSelected(ctrl && shift, ctrl && !shift);
                          e.Handled = true;
                      }
                  }

                  private void ExecuteSelected(bool runAsAdmin, bool openFolder)
                  {
                      var lbi = _resultsList.SelectedItem as ListBoxItem;
                      if (lbi == null) return;
                      var item = lbi.Tag as SearchItem;
                      if (item == null) return;

                      IncrementUsageScore(item.Title);

                      if (item.CustomAction != null)
                      {
                          item.CustomAction.Invoke();
                          if (item.Category != "NOTE") HideSearch();
                          return;
                      }

                      HideSearch();
                      try
                      {
                          if (openFolder && File.Exists(item.TargetPath))
                          {
                              Process.Start("explorer.exe", "/select,\"" + item.TargetPath + "\"");
                          }
                          else if (runAsAdmin)
                          {
                              Process.Start(new ProcessStartInfo(item.TargetPath)
                              {
                                  UseShellExecute = true,
                                  Verb = "runas"
                              });
                          }
                          else
                          {
                              Process.Start(new ProcessStartInfo(item.TargetPath) { UseShellExecute = true });
                          }
                      }
                      catch { }
                  }

                  public void ToggleSearch()
                  {
                      if (IsVisible && Opacity > 0.5)
                          HideSearch();
                      else
                          ShowSearch();
                  }

                  public void ShowSearch()
                  {
                      _isShowing = true;
                      ApplyThemeAndGeometry();
                      _searchBox.Clear();
                      _resultsList.Visibility = Visibility.Collapsed;
                      _notesBoard.Visibility = Visibility.Collapsed;
                      _settingsPanel.Visibility = Visibility.Collapsed;

                      Show();

                      // Force Windows 10 Foreground Focus so typing works immediately without clicking
                      try
                      {
                          IntPtr fgWindow = GetForegroundWindow();
                          IntPtr myHwnd = new WindowInteropHelper(this).Handle;
                          uint fgThread = GetWindowThreadProcessId(fgWindow, IntPtr.Zero);
                          uint myThread = GetCurrentThreadId();

                          if (fgThread != myThread && fgThread != 0)
                          {
                              AttachThreadInput(myThread, fgThread, true);
                              SetForegroundWindow(myHwnd);
                              BringWindowToTop(myHwnd);
                              AttachThreadInput(myThread, fgThread, false);
                          }
                          else
                          {
                              SetForegroundWindow(myHwnd);
                          }
                      }
                      catch { }

                      Activate();
                      Focusable = true;
                      _searchBox.Focusable = true;
                      _searchBox.Focus();
                      Keyboard.Focus(_searchBox);

                      // Extra Dispatcher tick to guarantee keyboard capture after Alt+Space release
                      Dispatcher.BeginInvoke(DispatcherPriority.Input, new Action(() =>
                      {
                          Activate();
                          _searchBox.Focus();
                          Keyboard.Focus(_searchBox);
                          _isShowing = false;
                      }));

                      var fade = new DoubleAnimation(0, 1, TimeSpan.FromMilliseconds(150));
                      var slide = new DoubleAnimation(-16, 0, TimeSpan.FromMilliseconds(180))
                      {
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      };
                      var scaleX = new DoubleAnimation(0.96, 1.0, TimeSpan.FromMilliseconds(180))
                      {
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      };
                      var scaleY = new DoubleAnimation(0.96, 1.0, TimeSpan.FromMilliseconds(180))
                      {
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      };

                      BeginAnimation(OpacityProperty, fade);
                      _slideTransform.BeginAnimation(TranslateTransform.YProperty, slide);
                      _scaleTransform.BeginAnimation(ScaleTransform.ScaleXProperty, scaleX);
                      _scaleTransform.BeginAnimation(ScaleTransform.ScaleYProperty, scaleY);
                  }

                  public void HideSearch()
                  {
                      if (!IsVisible) return;
                      Hide();
                      _resultsList.Items.Clear();
                      TrimMemory();
                  }

                  // Smart Most-Used Persistence
                  private string UsageFilePath => Path.Combine(AppConfig.FolderPath, "usage.dat");

                  private void LoadUsageData()
                  {
                      try
                      {
                          if (File.Exists(UsageFilePath))
                          {
                              foreach (var line in File.ReadAllLines(UsageFilePath))
                              {
                                  var parts = line.Split('|');
                                  int count;
                                  if (parts.Length == 2 && int.TryParse(parts[1], out count))
                                      _usageCounts[parts[0]] = count;
                              }
                          }
                      }
                      catch { }
                  }

                  private int GetUsageScore(string title)
                  {
                      int c;
                      return _usageCounts.TryGetValue(title, out c) ? c : 0;
                  }

                  private void IncrementUsageScore(string title)
                  {
                      if (string.IsNullOrEmpty(title)) return;
                      _usageCounts[title] = GetUsageScore(title) + 1;
                      try
                      {
                          Directory.CreateDirectory(AppConfig.FolderPath);
                          File.WriteAllLines(UsageFilePath, _usageCounts.Select(kv => kv.Key + "|" + kv.Value));
                      }
                      catch { }
                  }

                  // Sticky Notes Persistence
                  private string NotesFilePath => Path.Combine(AppConfig.FolderPath, "notes.dat");

                  private void LoadNotes()
                  {
                      _notes.Clear();
                      try
                      {
                          if (File.Exists(NotesFilePath))
                          {
                              foreach (var line in File.ReadAllLines(NotesFilePath))
                              {
                                  var parts = line.Split(new[] { "|||" }, StringSplitOptions.None);
                                  if (parts.Length >= 4)
                                  {
                                      int ci;
                                      int.TryParse(parts[3], out ci);
                                      _notes.Add(new NoteItem
                                      {
                                          Id = parts[0],
                                          Text = parts[1],
                                          Timestamp = parts[2],
                                          ColorIndex = ci
                                      });
                                  }
                              }
                          }
                      }
                      catch { }
                  }

                  private void SaveNotes()
                  {
                      try
                      {
                          Directory.CreateDirectory(AppConfig.FolderPath);
                          File.WriteAllLines(NotesFilePath, _notes.Select(n =>
                              n.Id + "|||" + n.Text.Replace("\r", " ").Replace("\n", " ") + "|||" + n.Timestamp + "|||" + n.ColorIndex));
                      }
                      catch { }
                  }

                  private void SetupTrayIcon()
                  {
                      _trayIcon = new Forms.NotifyIcon
                      {
                          Text = "ModernSearch (Alt + Space)",
                          Visible = true
                      };

                      try
                      {
                          var stream = Assembly.GetExecutingAssembly().GetManifestResourceStream("ModernSearch.icon.ico");
                          if (stream != null)
                              _trayIcon.Icon = new System.Drawing.Icon(stream);
                          else
                              _trayIcon.Icon = System.Drawing.SystemIcons.Application;
                      }
                      catch
                      {
                          _trayIcon.Icon = System.Drawing.SystemIcons.Application;
                      }

                      var menu = new Forms.ContextMenuStrip();
                      menu.Items.Add("Open Search (Alt + Space)", null, (s, e) => Dispatcher.Invoke(ShowSearch));
                      menu.Items.Add("Refresh App Index", null, (s, e) => Dispatcher.Invoke(RefreshCaches));
                      menu.Items.Add(new Forms.ToolStripSeparator());
                      menu.Items.Add("Exit", null, (s, e) =>
                      {
                          _trayIcon.Visible = false;
                          var hwnd = new WindowInteropHelper(this).Handle;
                          if (hwnd != IntPtr.Zero) UnregisterHotKey(hwnd, HOTKEY_ID);
                          Application.Current.Shutdown();
                      });

                      _trayIcon.ContextMenuStrip = menu;
                      _trayIcon.DoubleClick += (s, e) => Dispatcher.Invoke(ShowSearch);
                  }

                  private bool IsStartupEnabled()
                  {
                      try
                      {
                          using (var key = Registry.CurrentUser.OpenSubKey(@"Software\Microsoft\Windows\CurrentVersion\Run", false))
                          {
                              return key != null && key.GetValue("ModernSearch") != null;
                          }
                      }
                      catch { return false; }
                  }

                  private void SetStartup(bool enable)
                  {
                      try
                      {
                          using (var key = Registry.CurrentUser.OpenSubKey(@"Software\Microsoft\Windows\CurrentVersion\Run", true))
                          {
                              if (key == null) return;
                              if (enable)
                                  key.SetValue("ModernSearch", "\"" + Process.GetCurrentProcess().MainModule.FileName + "\"");
                              else
                                  key.DeleteValue("ModernSearch", false);
                          }
                      }
                      catch { }
                  }

                  private static void TrimMemory()
                  {
                      try
                      {
                          GC.Collect(GC.MaxGeneration, GCCollectionMode.Forced, true);
                          GC.WaitForPendingFinalizers();
                          EmptyWorkingSet(Process.GetCurrentProcess().Handle);
                      }
                      catch { }
                  }

                  [STAThread]
                  public static void Main()
                  {
                      bool createdNew;
                      using (var mutex = new System.Threading.Mutex(true, "ModernSearch_SingleInstance_Mutex", out createdNew))
                      {
                          if (!createdNew) return;
                          var app = new Application();
                          var win = new SearchWindow();
                          app.Run();
                      }
                  }
              }
          }
          '@
          Set-Content -Path "src/Program.cs" -Value $csCode -Encoding UTF8

      - name: Build Standalone EXE
        shell: pwsh
        run: |
          dotnet build src/ModernSearch.csproj -c Release -o out

      - name: Upload Compiled EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernSearch-Windows10
          path: out/ModernSearch.exe
