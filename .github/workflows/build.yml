name: Build Lightweight Search

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Icon and Source Code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src" | Out-Null

          # 1. Handle icon.ico or convert icon.png or create fallback icon
          Add-Type -AssemblyName System.Drawing
          function Convert-PngToIco($pngPath, $icoPath) {
              $bmp = New-Object System.Drawing.Bitmap($pngPath)
              $resized = New-Object System.Drawing.Bitmap($bmp, 64, 64)
              $ms = New-Object System.IO.MemoryStream
              $resized.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $pngBytes = $ms.ToArray()
              $fs = [System.IO.File]::Create($icoPath)
              $bw = New-Object System.IO.BinaryWriter($fs)
              $bw.Write([Int16]0); $bw.Write([Int16]1); $bw.Write([Int16]1)
              $bw.Write([byte]64); $bw.Write([byte]64); $bw.Write([byte]0); $bw.Write([byte]0)
              $bw.Write([Int16]1); $bw.Write([Int16]32)
              $bw.Write([Int32]$pngBytes.Length)
              $bw.Write([Int32]22)
              $bw.Write($pngBytes)
              $bw.Close(); $fs.Close(); $ms.Close(); $resized.Dispose(); $bmp.Dispose()
          }

          if (Test-Path "icon.ico") {
              Copy-Item "icon.ico" "src/icon.ico" -Force
          } elseif (Test-Path "icon.png") {
              Convert-PngToIco "icon.png" "src/icon.ico"
          } else {
              $bmp = New-Object System.Drawing.Bitmap(64, 64)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
              $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 0, 120, 215))
              $g.FillEllipse($brush, 4, 4, 56, 56)
              $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::White, 5)
              $g.DrawEllipse($pen, 16, 16, 22, 22)
              $g.DrawLine($pen, 34, 34, 46, 46)
              $g.Dispose()
              $bmp.Save("temp_icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              Convert-PngToIco "temp_icon.png" "src/icon.ico"
          }

          # 2. Create Project File (.NET Framework 4.8 - Native to Windows 10)
          $csproj = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net48</TargetFramework>
              <UseWPF>true</UseWPF>
              <UseWindowsForms>true</UseWindowsForms>
              <ApplicationIcon>icon.ico</ApplicationIcon>
              <AssemblyName>ModernSearch</AssemblyName>
              <PlatformTarget>x64</PlatformTarget>
              <Optimize>true</Optimize>
              <DebugType>none</DebugType>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="System.Data" />
              <Reference Include="System.Drawing" />
              <Reference Include="System.Net.Http" />
              <Reference Include="System.Security" />
              <Reference Include="System.Web.Extensions" />
              <EmbeddedResource Include="icon.ico"/>
            </ItemGroup>
          </Project>
          '@
          Set-Content -Path "src/ModernSearch.csproj" -Value $csproj -Encoding UTF8

          # 3. Create Application C# Source Code
          $csCode = @'
          using System;
          using System.Collections.Generic;
          using System.Data;
          using System.Diagnostics;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Net.Http;
          using System.Security.Cryptography;
          using System.Text;
          using System.Threading.Tasks;
          using System.Web.Script.Serialization;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Input;
          using System.Windows.Interop;
          using System.Windows.Media;
          using System.Windows.Media.Animation;
          using System.Windows.Media.Effects;
          using System.Windows.Media.Imaging;
          using System.Windows.Threading;
          using Microsoft.Win32;
          using Forms = System.Windows.Forms;

          namespace ModernSearch
          {
              public class SearchItem
              {
                  public string Title { get; set; }
                  public string Subtitle { get; set; }
                  public string TargetPath { get; set; }
                  public string Category { get; set; }
                  public string Emoji { get; set; }
                  public Action CustomAction { get; set; }
              }

              public class NoteItem
              {
                  public string Id { get; set; }
                  public string Text { get; set; }
                  public string Timestamp { get; set; }
                  public int ColorIndex { get; set; }
              }

              public class ShortcutAlias
              {
                  public string Name { get; set; }
                  public string Target { get; set; }
              }

              public class FavoriteEntry
              {
                  public string Title { get; set; }
                  public string TargetPath { get; set; }
                  public string Category { get; set; }
                  public string Emoji { get; set; }
              }

              public class AppConfig
              {
                  public bool SearchApps { get; set; } = true;
                  public bool SearchFiles { get; set; } = false;
                  public bool SearchSystem { get; set; } = true;
                  public bool SearchWeb { get; set; } = false;
                  public bool EnableCalc { get; set; } = true;
                  public bool EnableKill { get; set; } = true;
                  public bool EnableNotes { get; set; } = true;
                  public bool EnableAcrylic { get; set; } = true;
                  public bool EnableShortcuts { get; set; } = true;
                  public bool EnableFavorites { get; set; } = true;
                  public bool EnableFolderSearch { get; set; } = true;
                  public bool IncludeSubfolders { get; set; } = false;
                  public bool EnableAI { get; set; } = false;
                  public string SearchFolderPath { get; set; } = "";
                  public string AiModel { get; set; } = "gemini-3.5-flash-lite";
                  public int ThemeIndex { get; set; } = 0;
                  public double WindowWidth { get; set; } = 660;
                  public double PosXPercent { get; set; } = 50;
                  public double PosYPercent { get; set; } = 22;
                  public double CornerRadiusVal { get; set; } = 16;

                  public static string FolderPath => Path.Combine(
                      Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                      "ModernSearch");

                  private static string ConfigPath => Path.Combine(FolderPath, "settings.cfg");

                  public void Save()
                  {
                      try
                      {
                          Directory.CreateDirectory(FolderPath);
                          File.WriteAllLines(ConfigPath, new[]
                          {
                              "SearchApps=" + SearchApps,
                              "SearchFiles=" + SearchFiles,
                              "SearchSystem=" + SearchSystem,
                              "SearchWeb=" + SearchWeb,
                              "EnableCalc=" + EnableCalc,
                              "EnableKill=" + EnableKill,
                              "EnableNotes=" + EnableNotes,
                              "EnableAcrylic=" + EnableAcrylic,
                              "EnableShortcuts=" + EnableShortcuts,
                              "EnableFavorites=" + EnableFavorites,
                              "EnableFolderSearch=" + EnableFolderSearch,
                              "IncludeSubfolders=" + IncludeSubfolders,
                              "EnableAI=" + EnableAI,
                              "SearchFolderPath=" + Convert.ToBase64String(Encoding.UTF8.GetBytes(SearchFolderPath ?? "")),
                              "AiModel=" + AiModel,
                              "ThemeIndex=" + ThemeIndex,
                              "WindowWidth=" + WindowWidth,
                              "PosXPercent=" + PosXPercent,
                              "PosYPercent=" + PosYPercent,
                              "CornerRadiusVal=" + CornerRadiusVal
                          });
                      }
                      catch { }
                  }

                  public static AppConfig Load()
                  {
                      var cfg = new AppConfig();
                      try
                      {
                          if (File.Exists(ConfigPath))
                          {
                              foreach (var line in File.ReadAllLines(ConfigPath))
                              {
                                  var parts = line.Split(new[] { '=' }, 2);
                                  if (parts.Length != 2) continue;
                                  string k = parts[0].Trim();
                                  string v = parts[1].Trim();
                                  bool bVal = v.Equals("True", StringComparison.OrdinalIgnoreCase);
                                  double dVal;
                                  int iVal;

                                  if (k == "SearchApps") cfg.SearchApps = bVal;
                                  else if (k == "SearchFiles") cfg.SearchFiles = bVal;
                                  else if (k == "SearchSystem") cfg.SearchSystem = bVal;
                                  else if (k == "SearchWeb") cfg.SearchWeb = bVal;
                                  else if (k == "EnableCalc") cfg.EnableCalc = bVal;
                                  else if (k == "EnableKill") cfg.EnableKill = bVal;
                                  else if (k == "EnableNotes") cfg.EnableNotes = bVal;
                                  else if (k == "EnableAcrylic") cfg.EnableAcrylic = bVal;
                                  else if (k == "EnableShortcuts") cfg.EnableShortcuts = bVal;
                                  else if (k == "EnableFavorites") cfg.EnableFavorites = bVal;
                                  else if (k == "EnableFolderSearch") cfg.EnableFolderSearch = bVal;
                                  else if (k == "IncludeSubfolders") cfg.IncludeSubfolders = bVal;
                                  else if (k == "EnableAI") cfg.EnableAI = bVal;
                                  else if (k == "SearchFolderPath")
                                  {
                                      try { cfg.SearchFolderPath = Encoding.UTF8.GetString(Convert.FromBase64String(v)); }
                                      catch { cfg.SearchFolderPath = ""; }
                                  }
                                  else if (k == "AiModel") cfg.AiModel = v;
                                  else if (k == "ThemeIndex" && int.TryParse(v, out iVal)) cfg.ThemeIndex = iVal;
                                  else if (k == "WindowWidth" && double.TryParse(v, out dVal)) cfg.WindowWidth = dVal;
                                  else if (k == "PosXPercent" && double.TryParse(v, out dVal)) cfg.PosXPercent = dVal;
                                  else if (k == "PosYPercent" && double.TryParse(v, out dVal)) cfg.PosYPercent = dVal;
                                  else if (k == "CornerRadiusVal" && double.TryParse(v, out dVal)) cfg.CornerRadiusVal = dVal;
                              }
                          }
                      }
                      catch { }
                      return cfg;
                  }
              }

              public class SearchWindow : Window
              {
                  // Win32 Hotkey, Focus & Acrylic Blur APIs
                  [DllImport("user32.dll")]
                  private static extern bool RegisterHotKey(IntPtr hWnd, int id, uint fsModifiers, uint vk);

                  [DllImport("user32.dll")]
                  private static extern bool UnregisterHotKey(IntPtr hWnd, int id);

                  [DllImport("user32.dll")]
                  private static extern IntPtr GetForegroundWindow();

                  [DllImport("user32.dll")]
                  private static extern uint GetWindowThreadProcessId(IntPtr hWnd, IntPtr ProcessId);

                  [DllImport("kernel32.dll")]
                  private static extern uint GetCurrentThreadId();

                  [DllImport("user32.dll")]
                  private static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool fAttach);

                  [DllImport("user32.dll")]
                  private static extern bool SetForegroundWindow(IntPtr hWnd);

                  [DllImport("user32.dll")]
                  private static extern bool BringWindowToTop(IntPtr hWnd);

                  [DllImport("user32.dll")]
                  private static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);

                  [DllImport("shell32.dll")]
                  private static extern int SHEmptyRecycleBin(IntPtr hwnd, string pszRootPath, uint dwFlags);

                  [DllImport("psapi.dll")]
                  private static extern int EmptyWorkingSet(IntPtr hwProc);

                  [DllImport("user32.dll")]
                  private static extern int SetWindowCompositionAttribute(IntPtr hwnd, ref WindowCompositionAttributeData data);

                  [StructLayout(LayoutKind.Sequential)]
                  private struct AccentPolicy
                  {
                      public int AccentState;
                      public int AccentFlags;
                      public int GradientColor;
                      public int AnimationId;
                  }

                  [StructLayout(LayoutKind.Sequential)]
                  private struct WindowCompositionAttributeData
                  {
                      public int Attribute;
                      public IntPtr Data;
                      public int SizeOfData;
                  }

                  private const int HOTKEY_ID = 9001;
                  private const uint MOD_ALT = 0x0001;
                  private const uint VK_SPACE = 0x20;

                  private AppConfig _config;
                  private List<SearchItem> _appCache = new List<SearchItem>();
                  private List<SearchItem> _fileCache = null;
                  private List<SearchItem> _sysCache = null;
                  private Dictionary<string, int> _usageCounts = new Dictionary<string, int>(StringComparer.OrdinalIgnoreCase);
                  private Dictionary<string, ImageSource> _iconCache = new Dictionary<string, ImageSource>(StringComparer.OrdinalIgnoreCase);
                  private List<NoteItem> _notes = new List<NoteItem>();

                  private Border _mainBorder;
                  private TextBox _searchBox;
                  private TextBlock _placeholderText;
                  private TextBlock _searchIcon;
                  private ListBox _resultsList;
                  private Border _notesBoard;
                  private StackPanel _notesContainer;
                  private Border _settingsPanel;
                  private TranslateTransform _slideTransform;
                  private ScaleTransform _scaleTransform;
                  private Forms.NotifyIcon _trayIcon;
                  private bool _isShowing = false;
                  private bool _isLightTheme = false;
                  private Brush _primaryTextBrush = Brushes.White;
                  private Brush _secondaryTextBrush = new SolidColorBrush(Color.FromRgb(150, 155, 172));
                  private Brush _settingsPanelBrush = new SolidColorBrush(Color.FromArgb(215, 16, 17, 22));
                  private bool _systemThemeListenerAttached = false;

                  // Theme Palettes: [BgR, BgG, BgB, AccentR, AccentG, AccentB, BorderAlpha]
                  // Theme palettes: [BgR, BgG, BgB, AccentR, AccentG, AccentB, BorderAlpha]
                  // Index 0 follows Windows app theme; index 1 is Light; the rest are dark themes.
                  private readonly byte[][] _themes = new byte[][]
                  {
                      new byte[] { 22, 23, 28,   110, 170, 255, 65 }, // 0: System Auto fallback
                      new byte[] { 245, 247, 250, 0, 120, 215, 70 },  // 1: Light
                      new byte[] { 22, 23, 28,   110, 170, 255, 65 }, // 2: Frosted Dark
                      new byte[] { 14, 21, 38,   56, 189, 248,  80 }, // 3: Midnight Ocean
                      new byte[] { 8,  8,  10,   168, 85, 247,  75 }, // 4: OLED Pitch Black
                      new byte[] { 24, 15, 36,   244, 63, 94,   90 }  // 5: Cyberpunk Neon
                  };

                  public SearchWindow()
                  {
                      _config = AppConfig.Load();
                      LoadUsageData();
                      LoadNotes();
                      BuildUI();
                      ApplyThemeAndGeometry();
                      SetupTrayIcon();
                      RefreshCaches();
                  }

                  protected override void OnSourceInitialized(EventArgs e)
                  {
                      base.OnSourceInitialized(e);
                      var helper = new WindowInteropHelper(this);
                      var source = HwndSource.FromHwnd(helper.Handle);
                      source.AddHook(HwndHook);

                      // Register Alt + Space globally
                      RegisterHotKey(helper.Handle, HOTKEY_ID, MOD_ALT, VK_SPACE);
                      UpdateAcrylicBlur();
                      AttachSystemThemeListener();
                      TrimMemory();
                  }

                  private void AttachSystemThemeListener()
                  {
                      if (_systemThemeListenerAttached) return;
                      Microsoft.Win32.SystemEvents.UserPreferenceChanged += OnUserPreferenceChanged;
                      _systemThemeListenerAttached = true;
                  }

                  private void OnUserPreferenceChanged(object sender, Microsoft.Win32.UserPreferenceChangedEventArgs e)
                  {
                      if (e.Category != Microsoft.Win32.UserPreferenceCategory.General) return;
                      try
                      {
                          Dispatcher.BeginInvoke(new Action(() =>
                          {
                              if (_config.ThemeIndex == 0) ApplyThemeAndGeometry();
                          }));
                      }
                      catch { }
                  }

                  protected override void OnClosed(EventArgs e)
                  {
                      if (_systemThemeListenerAttached)
                      {
                          Microsoft.Win32.SystemEvents.UserPreferenceChanged -= OnUserPreferenceChanged;
                          _systemThemeListenerAttached = false;
                      }
                      try
                      {
                          var hwnd = new WindowInteropHelper(this).Handle;
                          if (hwnd != IntPtr.Zero) UnregisterHotKey(hwnd, HOTKEY_ID);
                          if (_trayIcon != null) _trayIcon.Visible = false;
                      }
                      catch { }
                      base.OnClosed(e);
                  }

                  private IntPtr HwndHook(IntPtr hwnd, int msg, IntPtr wParam, IntPtr lParam, ref bool handled)
                  {
                      const int WM_HOTKEY = 0x0312;
                      if (msg == WM_HOTKEY && wParam.ToInt32() == HOTKEY_ID)
                      {
                          ToggleSearch();
                          handled = true;
                      }
                      return IntPtr.Zero;
                  }

                  private void UpdateAcrylicBlur()
                  {
                      try
                      {
                          var hwnd = new WindowInteropHelper(this).Handle;
                          if (hwnd == IntPtr.Zero) return;
                          var accent = new AccentPolicy
                          {
                              AccentState = _config.EnableAcrylic ? 3 : 0, // 3 = ACCENT_ENABLE_BLURBEHIND
                              AccentFlags = 2,
                              GradientColor = unchecked((int)0x99141418)
                          };
                          int size = Marshal.SizeOf(accent);
                          IntPtr ptr = Marshal.AllocHGlobal(size);
                          Marshal.StructureToPtr(accent, ptr, false);
                          var data = new WindowCompositionAttributeData
                          {
                              Attribute = 19, // WCA_ACCENT_POLICY
                              SizeOfData = size,
                              Data = ptr
                          };
                          SetWindowCompositionAttribute(hwnd, ref data);
                          Marshal.FreeHGlobal(ptr);
                      }
                      catch { }
                  }

                  private void BuildUI()
                  {
                      Title = "ModernSearch";
                      Width = _config.WindowWidth;
                      SizeToContent = SizeToContent.Height;
                      WindowStyle = WindowStyle.None;
                      AllowsTransparency = true;
                      Background = Brushes.Transparent;
                      Topmost = true;
                      ShowInTaskbar = false;

                      var rootGrid = new Grid { Margin = new Thickness(24) };
                      var transformGroup = new TransformGroup();
                      _slideTransform = new TranslateTransform(0, 0);
                      _scaleTransform = new ScaleTransform(1, 1, 300, 0);
                      transformGroup.Children.Add(_scaleTransform);
                      transformGroup.Children.Add(_slideTransform);
                      rootGrid.RenderTransform = transformGroup;

                      _mainBorder = new Border
                      {
                          CornerRadius = new CornerRadius(_config.CornerRadiusVal),
                          BorderThickness = new Thickness(1.3),
                          Effect = new DropShadowEffect
                          {
                              BlurRadius = 32,
                              ShadowDepth = 10,
                              Opacity = 0.72,
                              Color = Colors.Black
                          }
                      };

                      var stack = new StackPanel();

                      // Top Search Bar Row
                      var searchGrid = new Grid { Margin = new Thickness(18, 14, 18, 14) };
                      searchGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                      searchGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                      searchGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                      _searchIcon = new TextBlock
                      {
                          Text = "⚡",
                          FontSize = 20,
                          VerticalAlignment = VerticalAlignment.Center,
                          Margin = new Thickness(0, 0, 12, 0)
                      };
                      Grid.SetColumn(_searchIcon, 0);

                      var inputContainer = new Grid();
                      _placeholderText = new TextBlock
                      {
                          Text = "Search apps, math (45*18%), 'note', 'kill', 'vol 50'...",
                          FontSize = 17,
                          Foreground = new SolidColorBrush(Color.FromRgb(115, 120, 138)),
                          VerticalAlignment = VerticalAlignment.Center,
                          IsHitTestVisible = false,
                          Margin = new Thickness(2, 0, 0, 0)
                      };

                      _searchBox = new TextBox
                      {
                          FontSize = 20,
                          FontWeight = FontWeights.Medium,
                          Foreground = Brushes.White,
                          Background = Brushes.Transparent,
                          BorderThickness = new Thickness(0),
                          VerticalContentAlignment = VerticalAlignment.Center
                      };
                      _searchBox.TextChanged += OnSearchTextChanged;
                      _searchBox.PreviewKeyDown += OnSearchKeyDown;

                      inputContainer.Children.Add(_placeholderText);
                      inputContainer.Children.Add(_searchBox);
                      Grid.SetColumn(inputContainer, 1);

                      // Settings Gear Button
                      var gearBtn = new Button
                      {
                          Content = "⚙",
                          FontSize = 18,
                          Foreground = new SolidColorBrush(Color.FromRgb(175, 180, 195)),
                          Background = Brushes.Transparent,
                          BorderThickness = new Thickness(0),
                          Cursor = Cursors.Hand,
                          ToolTip = "Customize Themes, Position, Size & Modules",
                          Padding = new Thickness(8, 2, 8, 2)
                      };
                      gearBtn.Click += (s, e) =>
                      {
                          _settingsPanel.Visibility = _settingsPanel.Visibility == Visibility.Visible
                              ? Visibility.Collapsed
                              : Visibility.Visible;
                      };
                      Grid.SetColumn(gearBtn, 2);

                      searchGrid.Children.Add(_searchIcon);
                      searchGrid.Children.Add(inputContainer);
                      searchGrid.Children.Add(gearBtn);
                      stack.Children.Add(searchGrid);

                      // Settings Panel
                      _settingsPanel = BuildSettingsPanel();
                      stack.Children.Add(_settingsPanel);

                      // Visual Sticky Notes Scratchpad
                      _notesBoard = BuildNotesBoard();
                      stack.Children.Add(_notesBoard);

                      // Results ListBox
                      _resultsList = new ListBox
                      {
                          Background = Brushes.Transparent,
                          BorderThickness = new Thickness(0),
                          MaxHeight = 370,
                          Margin = new Thickness(10, 0, 10, 10),
                          Visibility = Visibility.Collapsed
                      };
                      ScrollViewer.SetHorizontalScrollBarVisibility(_resultsList, ScrollBarVisibility.Disabled);
                      _resultsList.MouseDoubleClick += (s, e) => ExecuteSelected(false, false);
                      _resultsList.SelectionChanged += OnResultSelectionChanged;
                      stack.Children.Add(_resultsList);

                      _mainBorder.Child = stack;
                      rootGrid.Children.Add(_mainBorder);
                      Content = rootGrid;

                      Deactivated += (s, e) =>
                      {
                          if (!_isShowing) HideSearch();
                      };
                  }

                  private Border BuildNotesBoard()
                  {
                      var board = new Border
                      {
                          BorderBrush = new SolidColorBrush(Color.FromArgb(35, 255, 255, 255)),
                          BorderThickness = new Thickness(0, 1, 0, 0),
                          Padding = new Thickness(16, 12, 16, 14),
                          Visibility = Visibility.Collapsed
                      };

                      var outerStack = new StackPanel();
                      var headerGrid = new Grid { Margin = new Thickness(0, 0, 0, 10) };
                      headerGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                      headerGrid.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                      headerGrid.Children.Add(new TextBlock
                      {
                          Text = "✨ VISUAL SCRATCHPAD & STICKY NOTES",
                          FontSize = 11,
                          FontWeight = FontWeights.Bold,
                          Foreground = _isLightTheme
                              ? new SolidColorBrush(Color.FromRgb(0, 95, 180))
                              : new SolidColorBrush(Color.FromRgb(150, 195, 255))
                      });

                      var tipText = new TextBlock
                      {
                          Text = "Tip: Type 'note <your text>' & press Enter to pin a new card",
                          FontSize = 11,
                          Foreground = _secondaryTextBrush
                      };
                      Grid.SetColumn(tipText, 1);
                      headerGrid.Children.Add(tipText);
                      outerStack.Children.Add(headerGrid);

                      var scroll = new ScrollViewer
                      {
                          MaxHeight = 290,
                          VerticalScrollBarVisibility = ScrollBarVisibility.Auto
                      };
                      _notesContainer = new StackPanel();
                      scroll.Content = _notesContainer;
                      outerStack.Children.Add(scroll);

                      board.Child = outerStack;
                      return board;
                  }

                  private void RenderNotesBoard(string filterText)
                  {
                      _notesContainer.Children.Clear();
                      var list = _notes.AsEnumerable();
                      if (!string.IsNullOrWhiteSpace(filterText))
                          list = list.Where(n => n.Text.IndexOf(filterText, StringComparison.OrdinalIgnoreCase) >= 0);

                      var notesList = list.ToList();
                      if (notesList.Count == 0)
                      {
                          _notesContainer.Children.Add(new Border
                          {
                              CornerRadius = new CornerRadius(10),
                              Background = new SolidColorBrush(Color.FromArgb(22, 255, 255, 255)),
                              Padding = new Thickness(16, 18, 16, 18),
                              Child = new TextBlock
                              {
                                  Text = "No sticky notes yet. Type 'note Buy coffee at 5pm' above and hit Enter!",
                                  Foreground = _secondaryTextBrush,
                                  FontSize = 13,
                                  HorizontalAlignment = HorizontalAlignment.Center
                              }
                          });
                          return;
                      }

                      // Gradient pairs for vibrant sticky note cards
                      Color[][] cardGradients = new Color[][]
                      {
                          new[] { Color.FromArgb(65, 59, 130, 246), Color.FromArgb(35, 37, 99, 235) },
                          new[] { Color.FromArgb(65, 168, 85, 247), Color.FromArgb(35, 126, 34, 206) },
                          new[] { Color.FromArgb(65, 16, 185, 129), Color.FromArgb(35, 5, 150, 105) },
                          new[] { Color.FromArgb(65, 245, 158, 11), Color.FromArgb(35, 217, 119, 6) }
                      };

                      foreach (var note in notesList)
                      {
                          var pal = cardGradients[Math.Abs(note.ColorIndex) % cardGradients.Length];
                          var card = new Border
                          {
                              CornerRadius = new CornerRadius(12),
                              Background = new LinearGradientBrush(pal[0], pal[1], 25),
                              BorderBrush = new SolidColorBrush(Color.FromArgb(75, 255, 255, 255)),
                              BorderThickness = new Thickness(1),
                              Padding = new Thickness(14, 10, 14, 10),
                              Margin = new Thickness(0, 0, 0, 8)
                          };

                          var g = new Grid();
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
                          g.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                          var tStack = new StackPanel();
                          tStack.Children.Add(new TextBlock
                          {
                              Text = note.Text,
                              Foreground = Brushes.White,
                              FontSize = 14,
                              FontWeight = FontWeights.Medium,
                              TextWrapping = TextWrapping.Wrap
                          });
                          tStack.Children.Add(new TextBlock
                          {
                              Text = "🕒 " + note.Timestamp,
