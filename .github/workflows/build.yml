                  private StackPanel CreateSettingsCard(Panel parent, string title, string description)
                  {
                      var cardBorder = new Border
                      {
                          Background = new SolidColorBrush(Color.FromArgb(_isLightTheme ? (byte)238 : (byte)32, 255, 255, 255)),
                          BorderBrush = new SolidColorBrush(Color.FromArgb(_isLightTheme ? (byte)65 : (byte)38, 145, 155, 175)),
                          BorderThickness = new Thickness(1),
                          CornerRadius = new CornerRadius(11),
                          Padding = new Thickness(13, 11, 13, 12),
                          Margin = new Thickness(0, 0, 0, 10)
                      };
                      var card = new StackPanel();
                      card.Children.Add(new TextBlock
                      {
                          Text = title, FontSize = 12.5, FontWeight = FontWeights.Bold,
                          Foreground = _primaryTextBrush, Margin = new Thickness(0, 0, 0, 2)
                      });
                      if (!string.IsNullOrWhiteSpace(description)) card.Children.Add(CreateSettingsInfo(description));
                      cardBorder.Child = card;
